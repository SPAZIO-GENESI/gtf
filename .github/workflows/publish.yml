name: Build and publish Trust Center

on:
  push:
    branches: [main]
    paths:
      - "tenants/**"
      - "core/**"
      - "content/**"
      - "default-tenant.json"
      - "site/**"
      - "package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate
      - run: npm run score
      - run: npm run build-site
      # Rigenera site/changelog.html da content/changelog.yaml: senza questo
      # step il sito pubblicherebbe la sola copia rigenerata a mano in locale,
      # e un changelog dimenticato non farebbe diventare rosso nulla.
      - run: npm run build-changelog
      # Transitorio F1→F5 (P45): l'output del tenant ora vive in
      # tenants/attestazione/site/, ma finché la radice non ha un sito
      # proprio (F2) il deploy continua a pubblicare il tenant. Questo step
      # muore in F5, quando site/index.html sarà generato da build-root.mjs.
      - name: "Assembla il sito da pubblicare (transitorio: F1→F5)"
        run: |
          cp tenants/attestazione/site/index.html  site/index.html
          cp tenants/attestazione/site/score.json  site/score.json
          cp tenants/attestazione/site/badge.svg   site/badge.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
