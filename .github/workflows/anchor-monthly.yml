name: Crea il pacchetto del mese (ancoraggio dogfooding)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Solo se il pacchetto di questo mese è sbagliato e non è ancora stato attestato: l'impronta cambierà."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: anchor-monthly
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci

      - name: Crea (o rilegge) il pacchetto del mese
        id: bundle
        run: |
          set -e
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run anchor-monthly -- --force | tee /tmp/anchor-output.txt
          else
            npm run anchor-monthly | tee /tmp/anchor-output.txt
          fi

          # Nome del file dedotto per data (stessa logica UTC di anchor-monthly.mjs),
          # non ricavato da `git status`: nella prima esecuzione mai fatta in
          # questo repo, senza alcun file precedente già tracciato in anchors/,
          # `git status --porcelain <dir>` riporta la sola directory come nuova
          # invece del file — un parsing fragile su un caso limite reale.
          FILE_PATH="tenants/attestazione/snapshots/anchors/$(date -u +%Y-%m)-bundle.json"
          DIGEST="$(sha256sum "$FILE_PATH" | cut -d' ' -f1)"
          FILE_NAME="$(basename "$FILE_PATH")"

          echo "file_path=$FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Commit e push del pacchetto, solo se è comparso un file nuovo
        id: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenants/attestazione/snapshots/anchors/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica: il pacchetto di questo mese esisteva già."
          else
            git commit -m "chore: pacchetto ancoraggio ${{ steps.bundle.outputs.file_name }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Riepilogo
        run: |
          DIGEST="${{ steps.bundle.outputs.digest }}"
          FILE_NAME="${{ steps.bundle.outputs.file_name }}"
          DOWNLOAD_URL="https://github.com/SPAZIO-GENESI/gtf/raw/main/tenants/attestazione/snapshots/anchors/${FILE_NAME}"
          ATTEST_URL="https://attestazione.spaziogenesi.org"

          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            STATO="Pacchetto creato e pubblicato."
          else
            STATO="Il pacchetto di questo mese esisteva già — non è stato riscritto."
          fi

          {
            echo "## Ancoraggio dogfooding — ${FILE_NAME%-bundle.json}"
            echo ""
            echo "${STATO}"
            echo ""
            echo "**Impronta (SHA-256):**"
            echo '```'
            echo "${DIGEST}"
            echo '```'
            echo ""
            echo "### Prossimi passi"
            echo ""
            echo "1. **[Scarica il file](${DOWNLOAD_URL})**"
            echo "2. **[Attesta il file](${ATTEST_URL})** — trascinalo sul servizio, genera l'attestazione e **scarica il certificato PDF** (senza scaricare il PDF l'ancoraggio non parte)"
            echo "3. Controlla che l'impronta sul certificato sia identica a quella qui sopra"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
          FILE_NAME: ${{ steps.bundle.outputs.file_name }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          # Lo script va scritto su file con un heredoc quotato, non passato a
          # `node -e '...'`: il testo del messaggio contiene apostrofi (l'ancoraggio)
          # e dentro gli apici singoli di bash chiudono la stringa — errore di
          # sintassi della shell, invio mai tentato (bug reale del primo run, P49 F4).
          cat > /tmp/notify-anchor.mjs <<'NODE_SCRIPT'
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatIds = [process.env.TELEGRAM_CHAT_ID, process.env.TELEGRAM_CHAT_ID_SECONDARY].filter(Boolean);
            if (!token || chatIds.length === 0) {
              console.log("TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID assenti: nessun invio, solo log.");
              process.exit(0);
            }
            const fileName = process.env.FILE_NAME;
            const digest = process.env.DIGEST;
            const downloadUrl = `https://github.com/SPAZIO-GENESI/gtf/raw/main/tenants/attestazione/snapshots/anchors/${fileName}`;
            const stato = process.env.CHANGED === "true" ? "Pacchetto creato." : "Il pacchetto di questo mese esisteva già.";
            const text = `Genesis Trust Framework — ancoraggio dogfooding\n\n${stato}\n\nImpronta: <code>${digest}</code>\n\nScarica il file: ${downloadUrl}\nAttesta il file: https://attestazione.spaziogenesi.org\n\n(scarica anche il certificato PDF: senza, l'ancoraggio non parte)`;
            (async () => {
              for (const chatId of chatIds) {
                try {
                  const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: chatId, text, parse_mode: "HTML", disable_web_page_preview: true }),
                  });
                  if (!res.ok) console.error(`Invio Telegram fallito (chat ${chatId}): ${res.status} ${await res.text()}`);
                } catch (e) {
                  console.error(`Invio Telegram fallito (chat ${chatId}): ${e.message}`);
                }
              }
            })();
          NODE_SCRIPT
          node /tmp/notify-anchor.mjs
