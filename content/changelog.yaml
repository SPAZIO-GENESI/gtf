      invariato 91/100, 10/10 indicatori.

  - date: 2026-08-16
    component: framework
    version: null
    public: false
    title: "P45 F5: la radice passa al prodotto"
    body: >
      trust.spaziogenesi.org non pubblica piu' il Trust Center di un progetto ma
      la pagina del framework, con il riepilogo dei punteggi dei progetti che lo
      applicano. Rimosso da publish.yml lo step di assemblaggio transitorio nato
      in F1, che ricopiava l'output del tenant sulla radice. Gli URL che altri
