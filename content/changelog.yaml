      trust.spaziogenesi.org).
  - date: 2026-08-15
    component: framework
    version: null
    public: true
    title: Il Trust Framework diventa applicabile a più progetti
    body: >
      Il registro pubblico che alimenta questo Trust Center è ora costruito
      da un motore agnostico separato dai dati del progetto a cui si
