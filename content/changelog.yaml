# Changelog del Trust Framework — SORGENTE UNICA.
#
# Da qui si generano DUE rese (generatore: P44 F4, core/generators/build-changelog.mjs):
#   - CHANGELOG.md          alla radice del repo — TUTTE le voci, per chi sviluppa
#   - site/changelog.html   sul sito pubblico    — SOLO le voci con public: true
#
# Non scrivere a mano né CHANGELOG.md né la pagina del sito: verrebbero
# sovrascritti al prossimo build (stesso principio di site/index.html, PRN-03).
#
# Campi di una voce:
#   date       YYYY-MM-DD, obbligatorio
#   component  core | tenant:<id> | site | framework   (framework = governance, docs, processo)
#   version    versione del componente dopo questa voce, oppure null se non la cambia
#   public     true  -> compare sul sito pubblico: scrivila per chi legge da fuori
#              false -> resta solo nel CHANGELOG.md interno
#   title      una riga, senza punto finale
#   body       prosa breve; per le voci pubbliche: cosa cambia per chi usa il servizio,
#              non quale file è stato toccato
#
# Ordine: dalla più recente alla più vecchia.

entries:
  - date: 2026-08-16
    component: framework
    version: null
    public: false
    title: "P47 F7: pubblicazione e chiusura"
    body: >
      Le sei fasi di P47, fino a qui solo locali su tre repo, sono in
      produzione. Verificato dal vivo: i quattordici URL che dovevano
      restare in piedi rispondono tutti, l'unico 404 è quello deciso
      (il PDF del whitepaper sulla radice, che ora vive solo sul Trust
      Center dell'attestazione), i tre shim portano davvero dove
      dichiarano e i link del footer di entrambe le pagine — eseguiti,
      non letti — rispondono tutti, compresi i tre che erano rotti da
      P44. Il PDF riscaricato dal nuovo indirizzo ha l'impronta
      identica a quella attestata. Il collettore è stato eseguito per
      davvero: EVD-whitepaper-integrity è verde sul nuovo URL.
      Punteggio invariato, 91/100 e 10/10 indicatori su entrambi gli
      host.

  - date: 2026-08-16
    component: framework
    version: null
    public: true
    title: "Whitepaper e processo di rilascio: ognuno sul proprio indirizzo"
    body: >
      Il whitepaper tecnico e la pagina sul processo di rilascio (DevOps)
      del sistema di attestazione vivono ora sul Trust Center di quel
      progetto, attestazione.trust.spaziogenesi.org, invece che sulla
      pagina del framework. I vecchi indirizzi continuano a portare al
      posto giusto. Il documento del whitepaper è lo stesso file, con la
      stessa impronta digitale già attestata: ogni verifica fatta finora
      resta valida. Il motore che genera questo Trust Center è un
      prodotto di Tangram.page, che Spazio Genesi ETS applica ai propri
      servizi come partner tecnologico fornendo l'infrastruttura su cui
      gira.

  - date: 2026-08-16
    component: framework
    version: null
    public: true
    title: "Il registro della fiducia ha un indirizzo per progetto"
    body: >
      trust.spaziogenesi.org è ora la pagina del Genesis Trust Framework:
      cos'è, come funziona, e un riepilogo dei progetti a cui si applica. Il
      registro completo dell'attestazione — principi, controlli, evidenze,
      rischi, decisioni, il punteggio calcolato — vive ora al suo indirizzo
      proprio, attestazione.trust.spaziogenesi.org. Nulla di ciò che quel
      registro dimostra è cambiato: stessi record, stessa formula, stesso
      punteggio, verificabile come prima con gli stessi strumenti pubblici.
      È il passo che rende possibile applicare lo stesso framework a un
      secondo progetto senza confondere i due Trust Center sotto un solo
      indirizzo.

  - date: 2026-08-16
    component: framework
    version: null
    public: false
    title: "P45 F7: documentazione e chiusura"
    body: >
