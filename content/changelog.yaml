      (22 punti pubblici incorporano quel badge), e whitepaper-v1.0.pdf,
      whitepaper.html, devops.html e changelog.html non sono mai stati spostati.
      Bug reale trovato prima di pubblicare, non previsto dal piano: publish.yml
      non eseguiva build-root, quindi la radice avrebbe pubblicato le sole copie
      committate e il badge si sarebbe congelato in silenzio al valore
      dell'ultimo commit invece di seguire il punteggio reale — stessa falla gia'
      trovata su build-changelog in P44 F6. Aggiunto lo step mancante.

  - date: 2026-08-16
    component: framework
    version: null
    public: false
    title: "P45 F4: il Trust Center dell'attestazione risponde sul suo sottodominio"
    body: >
      attestazione.trust.spaziogenesi.org e' in linea: record CNAME verso
      spazio-genesi.github.io in DNS-only (mai proxato — e' un quarto livello e
      l'Universal SSL di Cloudflare ne copre uno solo; in DNS-only il
      certificato lo emette GitHub), dominio custom impostato sulle Pages del
      repo sottile, Enforce HTTPS attivo. Da ora il file CNAME e' scritto dal
      job di pubblicazione ricavando l'host da tenant.config.json
      (site.public_url): senza, il rsync --delete cancellerebbe quello scritto
      da GitHub e il dominio custom andrebbe perso al primo deploy. Verificato
      dal vivo: /, /badge.svg e /score.json a 200 con il punteggio 91/100 e
      10/10 indicatori, stile corretto (i percorsi assoluti ora risolvono).
      /devops.html, /whitepaper.html e /changelog.html rispondono 404 su questo
      host: sono contenuti che vivono sulla radice, atteso qui e corretto in
      F6.1. La radice resta invariata — sette URL a 200 e impronta del
      whitepaper 898ec9…de452 — quindi il Trust Center risponde ora su due
      host: e' la finestra sicura in cui F5 puo' spostare la radice.

  - date: 2026-08-16
    component: framework
    version: null
    public: false
    title: "P45 F3: il Trust Center dell'attestazione ha un repo di pubblicazione proprio"
    body: >
      Creato il repository pubblico SPAZIO-GENESI/trust-attestazione, di sola
      pubblicazione: il contenuto e' generato da qui e sovrascritto a ogni
      deploy (avvertenza esplicita nel suo README). Esiste perche' GitHub Pages
      ammette un solo dominio custom per repository, e questo repo pubblica
      gia' la radice. Il bersaglio si legge da tenant.config.json
      (site.publish_repo), non e' scritto nel workflow: al secondo tenant
      bastera' un altro pacchetto. Nuovo step in publish.yml che pubblica
      tenants/<id>/site/ con git push diretto (PAT dedicato, nessuna action di
      terze parti), sostituzione completa via rsync --delete; fallisce
      rumorosamente se il secret manca. Il file CNAME non si scrive ancora:
      con un dominio custom che non risolve, Pages redirigerebbe anche l'URL
      *.github.io e il sito sarebbe irraggiungibile — arriva in F4 col DNS.
      Verificato: spazio-genesi.github.io/trust-attestazione/ risponde 200 con
      overall 91 e 10/10 indicatori; i quattro percorsi assoluti del footer
      danno 404 (atteso su sottopercorso: /badge.svg si risolve col dominio
      custom in F4, gli altri tre in F6.1). trust.spaziogenesi.org invariato:
      sette URL a 200, badge ancora 91/100, SHA-256 del whitepaper
      898ec96815e6bee1f85f93651fb64b6d1ad289510f4ac2fd9fbaa92fe01de452.

