  - date: 2026-08-16
    component: framework
    version: null
    public: false
    title: "P45 F6: consumatori ed evidenze allineati ai due host"
    body: >
      Ora che entrambi gli host rispondono (radice = prodotto, sottodominio =
      Trust Center dell'attestazione), allineati i riferimenti interni. Nel
