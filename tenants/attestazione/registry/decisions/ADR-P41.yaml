id: ADR-P41
title: "P41 — Versione inglese del servizio: la lingua è resa, mai un fatto attestato"
date: 2026-07-24
status: accepted
context: >
  Il servizio è nato interamente in italiano, ma i suoi canali
  programmabili (pacchetto npm, MCP Registry, GitHub Action, repository
  pubblici) sono per natura internazionali. Rendere il servizio bilingue
  tocca superfici molto diverse per rischio: pagine statiche, pagine
  generate dal Worker, messaggi d'errore dell'API e, la più delicata, il
  contenuto del certificato PDF — l'artefatto probatorio.
decision: >
  Scopo MVP: sito italiano, percorso inglese completo per chi arriva dal
  canale programmabile — sei pagine duplicate sotto `/en/`, le due pagine
  HTML servite dal Worker, e i messaggi d'errore di `/api/hash` e
  `/api/cert-pdf` via campo facoltativo `lang` (fallback
  `Accept-Language`). Fuori scopo: pagine di chi è già dentro (profilo,
  stato, sicurezza, vetrina, changelog) e lo storico.

  **Invariante che regge il piano: `lang` non entra mai in
  `hmacMessage`.** La lingua è resa, non un fatto sull'opera — legarla
  alla firma invaliderebbe la verifica di tutti i certificati già emessi.
  Verificato direttamente: la stessa coppia attestazione+HMAC produce il
  certificato in entrambe le lingue, `/api/verify` risponde
  `hmac_valido: true` in entrambi i casi, un certificato pre-P41 resta
  verificabile senza eccezioni.

  L'informativa privacy inglese è dichiarata **traduzione di cortesia**
  (l'italiana fa fede): tradurre un testo con effetti giuridici senza
  revisione legale non lo rende ufficiale, e dirlo è più onesto che
  lasciarlo intendere. Nessun rilevamento automatico della lingua né
  redirect: solo un selettore visibile.

  Guardia CI obbligatoria contro la divergenza fra le due versioni:
  registro delle coppie con l'impronta SHA-256 del file italiano al
  momento della traduzione, fallisce se l'italiano cambia senza che
  l'inglese sia aggiornato. Pagine EN statiche, nessuno step di build.

  Accettato per l'MVP: le etichette AcroForm del template PDF restano
  italiane anche nel certificato inglese (tradurle richiederebbe un
  secondo template da riverificare nelle coordinate) — il certificato EN
  è quindi misto. QR e URL di verifica invariati per lingua, la pagina si
  apre nella lingua di chi la visita, non di chi ha emesso.
consequences: >
  Contratto API puramente additivo: senza il campo `lang` ogni risposta,
  pagina e PDF restano bit-identici a prima — verificato, non dichiarato.
  Nessun endpoint/dato/trattamento nuovo, nessun rischio o controllo nuovo
  nel registro: l'informativa è tradotta, non estesa.

  Rilasciato in due tempi per ragione strutturale: il sito statico
  pubblica al push, il Worker ha un gate di produzione separato — le
  pagine inglesi sono andate live prima del motore bilingue, nessuna
  dipendenza fra le due parti. Deploy del Worker (imgauth 1.33.0)
  approvato dal gestore come ogni rilascio di produzione.

  Criterio per estendere lo scopo (altre pagine, altre lingue): il
  traffico reale su `/en/` nelle settimane successive. Se non si
  materializza, l'estensione non si fa.
visibility: public
