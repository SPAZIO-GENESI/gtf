id: ADR-A1
title: "A1 — Provenienza di build firmata sugli artefatti rilasciati (attest-mcp)"
date: 2026-08-12
status: accepted
context: >
  La catena «sorgente pubblico → binario scaricato» dei sei eseguibili
  standalone di `sg-attest` (ADR-P40) si reggeva sul solo
  `SHA256SUMS.txt`: dimostra che il file non è cambiato dopo la build, non
  che sia stato costruito da quel sorgente/commit/workflow. Complemento
  naturale di ADR-P37 (che aveva scartato Sigstore per le *opere*
  attestate, categoria sbagliata — qui il dominio è l'opposto: firma di un
  artefatto software, il caso d'uso proprio di quella tecnologia).
decision: >
  Attivato **GitHub Artifact Attestations**
  (`actions/attest-build-provenance@v4`) sul job `release` di
  `release-binaries.yml`: firma con identità OIDC effimera i sei binari
  pubblicati (subject-path `dist/*`, prima della generazione di
  `SHA256SUMS.txt` così il checksum derivato non viene mai attestato),
  registrata in transparency log pubblico. Permessi `id-token: write` +
  `attestations: write` solo sul job `release`. Verificato sul primo tag
  reale (v0.4.2) e con `gh attestation verify` su un binario scaricato
  dalla Release pubblica, positivo sul file autentico e negativo su una
  copia alterata di un byte.

  **`gh attestation verify` richiede una sessione GitHub autenticata anche
  su repository pubblici** (exit 4 senza login, confermato). Il dato
  sottostante è pubblico (`GET api.github.com/.../attestations/<digest>`
  risponde 200 senza credenziali, verificato con `curl` puro), ma non
  esisteva una procedura a comando singolo senza `gh` autenticato — limite
  del client, non del dato, dichiarato esplicitamente nel `verify_howto`.
  Chiuso lo stesso giorno: `attest-mcp/scripts/verify-provenance.mjs`
  (PR #2) interroga l'endpoint REST pubblico e verifica il bundle Sigstore
  con la libreria npm `sigstore` (verificata a sua volta contro Rekor/
  Fulcio/TUF pubblici — nessun account in nessun punto della catena).
  Scelta `sigstore` (libreria) invece di `cosign` (binario Go): progetto
  interamente Node/Bun, script auto-contenuto con solo `npm install`,
  stessa libreria con cui GitHub costruisce le attestazioni. Aggiunta come
  devDependency, non tocca `src/*` né le dipendenze del pacchetto
  pubblicato. Collaudato sui sei binari del tag v0.4.2: file autentico →
  verifica riuscita; rinominato → riuscita con avviso (il legame è sul
  digest in-toto, non sul nome); un byte alterato → fallita.

  **Nota di sicurezza per chi tocca questo script**: `sigstore.verify()`
  non lega da sé l'artefatto al subject per un bundle DSSE — accetta bytes
  estranei come `data` senza far fallire la verifica crittografica (il
  confronto interno è fra payload e firma, non fra artefatto e payload).
  Un'implementazione che si fidasse di quel parametro per il legame
  sarebbe silenziosamente insicura. Lo script fa il legame esplicitamente,
  confrontando il digest calcolato sul file locale con quello del subject
  nel predicato in-toto.

  **Per A2** (firma del codice, non ancora eseguita): l'ordine è
  vincolante — build → firma → attestazione di provenienza sul binario
  *firmato* → checksum → Release. Chi esegue A2 deve riposizionare lo step
  di attestazione esistente dopo la firma, non aggiungerne uno accanto,
  altrimenti l'attestazione risulterebbe orfana.

  Collegato a `REQ-27001-inspiration-01` (non `REQ-27037-pres-01`,
  proposto dal design doc: quel requisito copre la conservazione delle
  prove delle *opere* attestate, dominio diverso dalla provenienza di un
  *artefatto software*).
consequences: >
  `CTL-build-provenance` nasce e resta `draft`: la promozione ad `active`
  è una decisione del gestore, non tecnica. Nessun `RSK` creato per la
  manomissione della catena di distribuzione dei binari — lasciato come
  domanda aperta.

  Fuori scopo: attestazione del pacchetto npm (pubblicato a mano, non da
  CI); SLSA build level 3; modifiche al motore `imgauth`.
affects: [CTL-build-provenance]
visibility: public
