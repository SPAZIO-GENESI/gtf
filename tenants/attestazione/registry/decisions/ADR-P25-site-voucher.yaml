id: ADR-P25-site-voucher
title: "P25 (C) — \"Attesta con la tua email\" dal sito: voucher stateless invece di una sessione"
date: 2026-07-12
status: accepted
context: >
  Le convenzioni (ADR-P25-conventions) erano fruibili solo via chiave API
  o client MCP, ma il pubblico reale (studenti, professionisti non
  tecnici) non usa strumenti da sviluppatore: deve attestare direttamente
  dal sito, come già avviene in forma anonima. Serviva riconoscere
  l'email istituzionale senza cookie, sessioni server o un secondo
  sistema di login — il percorso anonimo resta a zero dati personali.
decision: >
  Stesso OAuth one-shot già usato per le chiavi API, ma l'esito non è
  persistito in D1: un **voucher stateless firmato** —
  `base64url(JSON{email,conv,exp}) + '.' + HMAC-SHA256(...)`, TTL 8 ore
  — consegnato nel fragment dell'URL (`#sgv=`, mai inviato a un server) e
  tenuto in `sessionStorage` (niente cookie, sparisce alla chiusura della
  scheda). Il campo `conv` è solo un hint: la fonte di verità resta una
  query fresca (`matchConvention`) a ogni uso su `/api/hash`, così una
  convenzione disattivata smette di dare vantaggi senza meccanismo di
  revoca. La contabilità pool/tetto riusa la stessa funzione condivisa
  delle chiavi API (`accountConventionUsage`): comportamento identico su
  entrambi i canali, mai un blocco.
consequences: >
  Nessuna riga D1 per il solo accesso (a differenza delle chiavi API).
  Testato in locale (D1 reale): voucher con/senza convenzione, tetto,
  pool esaurito, convenzione disattivata dopo l'emissione, voucher
  scaduto/manomesso (403). Rilasciato lo stesso giorno (imgauth 1.21.2,
  authweb 1.17.0), poi verificato con login OAuth reale in produzione —
  prima prova end-to-end del canale. `CTL-site-voucher-auth` promosso
  `draft`→`active`.

  **Incidente di concorrenza, risolto in pochi minuti**: il codice è
  arrivato in produzione tramite il commit di una sessione di lavoro
  concorrente sullo stesso checkout, non un rilascio deliberato via gate
  P24, prima che la migrazione schema (`voucher.sql`) fosse applicata
  alla D1 remota — `/developer/keys` (P22, in uso reale) ha risposto 500
  fino all'applicazione. Nessuna perdita di dati; classe di rischio già
  coperta da `RSK-unobserved-production-deploy`, l'incidente è avvenuto
  proprio perché il rilascio non è passato dal gate.

  Due difetti non rilevabili dai test locali, emersi al primo uso reale e
  corretti: i bottoni dei provider resi invisibili da una classe CSS
  riusata fuori contesto (i test verificavano il DOM, non la posizione
  visiva); il pannello `/admin` che non ricaricava i dati alla riapertura
  di una scheda (emerge solo con due sessioni in parallelo).
  `/condizioni/`: rimosso il tag "in arrivo" per la fascia Convenzione
  (resta per Professionale, non ancora costruita).
affects: [CTL-site-voucher-auth, CTL-convention-accounting, RSK-agent-credential-abuse]
evidence: [EVD-git-imgauth, EVD-git-imgauthweb, EVD-site-voucher-local-test, EVD-site-voucher-live-test]
visibility: public
