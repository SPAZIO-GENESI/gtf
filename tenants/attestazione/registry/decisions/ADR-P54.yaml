id: ADR-P54
title: "P54 — CodeQL: copertura, triage del debito e rifiuto di GitHub Code Quality"
date: 2026-08-19
status: accepted
context: >
  Nato da una domanda del gestore su GitHub Code Quality (prodotto a
  pagamento, GA dal 20/07/2026, $10/committer/mese sui repo privati). La
  ricognizione ha mostrato che il prodotto non era la leva utile: CodeQL
  girava già da sei giorni (da A3, 13/08) su cinque repo e aveva lasciato
  73 alert aperti mai triati, mentre `autart-signer` (il firmatario
  PKCS#7, unico componente Python del flusso probatorio), `gtf` e
  `attest-action` non erano coperti affatto. Il processo dichiarato
  `PRC-security-alert-triage` (cadenza settimanale, Federico Battisti) non
  aveva mai girato.
decision: >
  **GitHub Code Quality: rifiutato.** Non produce alcun riconoscimento
  pubblico (alert solo su tab Security, accesso in scrittura; dashboard
  interna), costa $10/committer/mese sui repo privati (fuori dalla licenza
  Team nonprofit), e il suo meccanismo (commenti in PR) rende poco su
  questi repo dove si lavora quasi sempre a push diretto su main.

  **Triage completo dei 73 alert reali** (F1, verificato: erano 74, non
  73 — errore di conteggio iniziale corretto durante l'esecuzione): 14
  alert CodeQL letti a codice, non a titolo di regola. 13 dismiss
  motivati con verifica nel codice (falsi positivi su script
  diagnostici/build-time, o dati che non arrivano mai a un sink
  sensibile — es. il token di `attest-mcp` non entra mai nell'oggetto
  stampato da `printJson`). 1 fix reale: ReDoS in `attest-bot/src/worker.js`
  (unico alert su input esterno non fidato — messaggi Telegram), PR aperta
  (#4), collaudato con verifica di equivalenza semantica su 7 casi. I 60
  alert Scorecard raggruppati per categoria; `FuzzingID` (5, ora 4 dopo
  correzione conteggio repo) dismissato **per sempre** su decisione
  esplicita del gestore (F2, 19/08).

  **Copertura estesa** (F4-F5): CodeQL Python su `autart-signer` — prima
  analisi statica della sua storia, verde, zero alert (PR #11, ⚠️ il
  merge innesca il deploy Azure reale del firmatario). CodeQL+Scorecard
  su `gtf` (PR #9) e `attest-action` (PR #1, linguaggio `actions`,
  l'unico pertinente per una composite action senza codice applicativo).
  Scorecard su `attest-bot` (PR #5) e `attest-mcp-remote` (PR #7), che
  avevano già CodeQL da A3 ma non la valutazione di postura.

  **Hardening di `attest-mcp`** (F6, PR #10): era il repo peggiore,
  Scorecard 3.5/10. `npm audit` ha trovato 4 vulnerabilità transitive
  reali (hono, @hono/node-server, fast-uri, ip-address — via
  `@modelcontextprotocol/sdk`/`sigstore`), risolte con `npm audit fix`
  senza toccare i range dichiarati. Pin per SHA su tutti i workflow,
  `SECURITY.md`, `permissions` minime. Il bump di `upload-artifact`/
  `download-artifact` (v4→v7/v8, necessario in coppia per l'hash
  enforcement introdotto in v8) non è stato solo dedotto dal changelog:
  collaudato con un self-test reale (`workflow_dispatch` di
  `release-binaries.yml`, che costruisce i sei binari pubblici di
  `sg-attest`) prima di aprire la PR. 5 delle 6 PR Dependabot aperte
  assorbite e chiuse con commento; la sesta (bump diretto della SDK,
  non di sicurezza) lasciata a sé.

  **Badge (F7)**: i badge Scorecard erano già nei README di
  imgauth/imgauthweb (lavoro precedente al 13/08). Per il badge OpenSSF
  Best Practices, il piano indicava `imgauth` come primo candidato — **la
  verifica ha trovato che `imgauth` non ha una suite di test automatica**
  (`package.json`: `"test": "echo ... && exit 1"`, fallisce sempre), e il
  criterio `test` del badge è obbligatorio: la candidatura sarebbe
  fallita di sicuro. Candidato corretto: `attest-mcp` (11 test veri).
  Sezione Contributing aggiunta al README, note delle 3 GitHub Release
  (erano vuote) riscritte sui commit reali. Autovalutazione completa dei
  criteri "passing" preparata e verificata contro il repo, non
  sottomessa: richiede login del gestore.

  **Branch protection** (F8, scoperto in chiusura non ancora eseguito
  nonostante la decisione F2): estesa la protezione **base** (niente
  force-push, niente cancellazione branch, **nessuna PR obbligatoria**)
  ad `attest-mcp`, `attest-bot`, `attest-mcp-remote` — stessa
  configurazione già attiva su `imgauth`/`imgauthweb`/`autart-signer` dal
  13/08 (`ADR-A3-parte4`/`CTL-scorecard-monitoring`), **non** la PR
  obbligatoria: il gestore, ririchiesto esplicitamente dato il conflitto
  con la decisione del 13/08, ha confermato di voler mantenere il push
  diretto su main. Gli alert Scorecard `BranchProtectionID`/`CodeReviewID`
  restano quindi aperti per scelta dichiarata, non per omissione — ora
  su tutti e sei i repo, non più solo su tre.
consequences: >
  **Live oggi**: i 17 dismiss di alert CodeQL/Scorecard (stato mutato via
  API, non richiede merge) e l'estensione della branch protection base ai
  tre repo scoperti (via API, verificato con `curl` che tutti e sei ora
  hanno `allow_force_pushes=false`, `allow_deletions=false`,
  `required_pull_request_reviews=null`, coerenti fra loro).

  **Non ancora live**: 7 PR aperte in attesa del merge del gestore
  (attest-bot#4 fix ReDoS, autart-signer#11 CodeQL Python ⚠️ deploy
  Azure, gtf#9, attest-action#1, attest-bot#5, attest-mcp-remote#7,
  attest-mcp#10 hardening) — nessuna mergiata da questa sessione: il
  classificatore di sicurezza di Claude Code ha rifiutato un tentativo di
  merge in F4, coerente col fatto che una delle PR tocca la produzione.
  `CTL-static-analysis`/`CTL-scorecard-monitoring` **non vengono estesi
  in questo ADR** a `gtf`/`attest-action`/`autart-signer`(CodeQL)/
  `attest-bot`/`attest-mcp-remote`(Scorecard): la copertura reale non è
  ancora in produzione. Un aggiornamento separato del registro va fatto
  dopo il merge delle 7 PR, con verifica dal vivo (stesso principio di
  `ADR-A3-parte4`: non dichiarare com'è un controllo finché non è
  verificato con dati reali).

  Il badge OpenSSF Best Practices per `attest-mcp` non è stato
  sottomesso: bozza pronta in `img-auth-hub/p54-f7-badge-attest-mcp.md`,
  la sottomissione richiede il login GitHub del gestore.
affects: [CTL-static-analysis, CTL-scorecard-monitoring]
evidence: []
visibility: public
