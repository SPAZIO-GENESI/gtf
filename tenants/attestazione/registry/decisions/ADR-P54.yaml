id: ADR-P54
title: "P54 — CodeQL: copertura, triage del debito e rifiuto di GitHub Code Quality"
date: 2026-08-19
status: accepted
context: >
  Valutazione di GitHub Code Quality (prodotto a pagamento, GA dal
  20/07/2026, $10/committer/mese sui repo privati) ha portato alla luce che
  CodeQL era già attivo da A3 (13/08) su cinque repo con 74 alert mai
  triati, mentre `autart-signer` (il firmatario PKCS#7, unico componente
  Python del flusso probatorio), `gtf` e `attest-action` non erano coperti.
  `PRC-security-alert-triage` (cadenza settimanale) non aveva mai girato.
decision: >
  **GitHub Code Quality rifiutato**: nessun riconoscimento pubblico (alert
  solo su tab Security ad accesso ristretto), costo su repo privati fuori
  dalla licenza Team nonprofit, valore concentrato in commenti di PR su
  repo dove si lavora quasi sempre a push diretto.

  **Triage dei 74 alert**: 1 fix reale (ReDoS su input Telegram non
  fidato in `attest-bot`, PR #4, verifica di equivalenza semantica su 7
  casi), 13 dismiss motivati con verifica nel codice (falsi positivi su
  script diagnostici/build-time o dati mai raggiungibili dal sink
  segnalato), 60 alert Scorecard raggruppati per categoria.
  `FuzzingID` dismissato per sempre su decisione esplicita del gestore.

  **Copertura estesa**: CodeQL Python su `autart-signer` (prima analisi
  statica della sua storia, verde) e CodeQL+Scorecard su `gtf`/
  `attest-action`/`attest-bot`/`attest-mcp-remote`.

  **`attest-mcp` messo in sicurezza** (Scorecard 3.5/10, il più basso del
  gruppo): 4 vulnerabilità transitive reali risolte con `npm audit fix`
  senza toccare i range dichiarati; pin per SHA su tutti i workflow;
  `upload-artifact`/`download-artifact` allineati a v7/v8 (necessario in
  coppia per l'hash enforcement di v8) e collaudati con un self-test
  reale prima di aprire la PR.

  **Candidato del badge OpenSSF Best Practices corretto**: `imgauth`,
  indicato inizialmente, non ha una suite di test automatica — criterio
  obbligatorio del badge. Sostituito con `attest-mcp` (11 test reali).

  **Branch protection**: estesa la protezione base (niente force-push,
  niente cancellazione branch) da tre a tutti e sei i repo del flusso,
  **senza** rendere obbligatoria la revisione via PR — coerente con la
  scelta già presa il 13/08 di mantenere il push diretto su main. Gli
  alert Scorecard `BranchProtectionID`/`CodeReviewID` restano quindi
  aperti per scelta dichiarata su tutti e sei i repo.
consequences: >
  Live: i dismiss di alert (stato mutato via API) e l'estensione della
  branch protection (verificata via API su tutti e sei i repo).

  Non ancora live: 7 PR aperte in attesa di merge del gestore (fra cui
  `autart-signer#11`, che innesca un deploy Azure reale al merge) — il
  merge non è stato eseguito da questa sessione, bloccato dal
  classificatore di sicurezza di Claude Code. `CTL-static-analysis`/
  `CTL-scorecard-monitoring` non vengono estesi finché quella copertura
  non è in produzione (stesso principio di `ADR-A3-parte4`).

  Bozza del badge OpenSSF pronta in `img-auth-hub/p54-f7-badge-attest-mcp.md`,
  sottomissione non eseguita: richiede il login GitHub del gestore.
affects: [CTL-static-analysis, CTL-scorecard-monitoring]
evidence: []
visibility: public
