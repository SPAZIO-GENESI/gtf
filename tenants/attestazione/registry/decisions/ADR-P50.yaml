id: ADR-P50
title: "P50 — Scopribilità per agenti AI: dichiarare quello che c'è, e non dichiarare quello che non c'è"
date: 2026-08-17
status: accepted
context: >
  Il servizio pubblica da mesi canali pensati per programmi e agenti AI
  (due server MCP, una CLI, una GitHub Action, eseguibili standalone, un
  contratto OpenAPI) ma non lo dichiarava nei luoghi convenzionali dove un
  agente guarda prima di leggere una pagina HTML: un rilevatore pubblico
  di "agent readiness" classificava il sito al livello più basso. La
  causa non era tecnica: mancavano i documenti di presentazione.

  Due vincoli reali misurati, indipendenti da questo lavoro: la zona è su
  un piano gratuito (nessuna conversione automatica in Markdown offerta
  dal provider) e il DNS non è autenticato — DNSSEC non attivo
  (`delegationSigned: false` sul registro `.org`). ⚠️ Corretta prima di
  agire una lettura iniziale sbagliata: i record DNSKEY presenti nelle
  risposte sono le chiavi condivise dell'infrastruttura del provider,
  restituite anche per zone non firmate — non provano che la zona sia
  firmata.
decision: >
  Pubblicati come file statici i descrittori corrispondenti a capacità
  realmente esistenti: preferenze AI in `robots.txt`, un catalogo API
  (RFC 9727), una MCP Server Card, un indice di *agent skills* con due
  istruzioni operative, un documento sulle credenziali, una mappa dei
  link, tre strumenti **in sola lettura** via WebMCP (stato, verifica
  firma, ricerca impronta).

  **Deliberatamente non pubblicati** quattro descrittori che il
  rilevatore verifica, perché descriverebbero capacità inesistenti:
  metadati OAuth/OIDC di discovery (nessun authorization server reale);
  metadati di risorsa protetta OAuth (richiedono un elenco di issuer
  inesistente); una A2A Agent Card (qui ci sono strumenti che un agente
  usa, non un agente conversazionale); la directory Web Bot Auth (il
  servizio non fa crawling). Criterio applicato, valido oltre questo
  piano: **un 404 è preferibile a un metadato falso** — un descrittore
  assente dice "qui non c'è", uno che mente rompe chi vi si affida.

  Nessuno strumento WebMCP attesta: la challenge anti-bot davanti
  all'emissione esiste perché l'attestazione sia un gesto umano.

  Contro l'invecchiamento dei descrittori: l'indice delle skill dichiara
  lo SHA-256 di ogni istruzione, con guardia CI che fallisce se il testo
  cambia senza riallineare il digest, ed evidenza settimanale che
  ricalcola i digest dal vivo.
consequences: >
  Il livello del rilevatore esterno passa da 1 al massimo previsto dalla
  scala, 11 controlli su 15 soddisfatti.

  ⚠️ **Rettifica registrata perché istruttiva**: una prima analisi aveva
  scartato la negoziazione di contenuto Markdown per due motivi rivelatisi
  infondati — si credeva richiedesse un piano a pagamento (esiste invece
  una regola di riscrittura all'edge gratuita, attiva solo su
  `Accept: text/markdown`, che nessun browser invia) e si riteneva il
  beneficio marginale (vero nel merito, ma quel singolo controllo separava
  dal livello massimo). Lezione: una soluzione va scartata dopo aver
  verificato le alternative, non dopo averne immaginate due. Il gemello
  Markdown è generato dalla pagina con guardia CI che blocca la
  pubblicazione se diverge; nessun conteggio token dichiarato (sarebbe
  falso dal primo cambiamento di contenuto).

  Pubblicati record DNS-AID (SVCB sotto `_agents`): indice
  d'organizzazione, uno sul dominio del servizio, uno per il server MCP
  in esercizio. **Nessun record `_a2a`**, coerente con l'assenza
  dell'Agent Card — verificata attivamente dall'evidenza settimanale, non
  solo omessa. Scommessa dichiarata: il documento di riferimento è un
  Internet-Draft individuale non avallato IETF, in scadenza fine novembre
  2026 (data annotata in ogni record). Nessun processo ricorrente creato:
  il rischio peggiore è che i record vengano ignorati.

  Nessun controllo/rischio/trattamento nuovo nel registro: sono documenti
  descrittivi, non meccanismi di sicurezza, non raccolgono nulla.

  Due questioni preesistenti restano aperte: attivare DNSSEC (record DS
  dal registrar — margine d'errore che renderebbe il dominio
  irrisolvibile, va eseguito con verifica immediata) e i caratteri
  tipografici caricati da un fornitore terzo (espone l'IP del visitatore,
  a differenza delle altre dipendenze terze già auto-ospitate).
visibility: public
