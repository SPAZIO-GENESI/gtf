id: ADR-P50
title: "P50 — Scopribilità per agenti AI: dichiarare quello che c'è, e non dichiarare quello che non c'è"
date: 2026-08-17
status: accepted
context: >
  Il servizio pubblica da mesi canali pensati per essere usati da programmi e da
  agenti AI: due server MCP (uno locale, uno remoto), una CLI, una GitHub Action,
  eseguibili standalone, un contratto OpenAPI. Ma non lo dichiarava in nessuno dei
  luoghi convenzionali dove un agente guarda **prima** di leggere una pagina HTML:
  un rilevatore pubblico di "agent readiness" classificava il sito al livello più
  basso, "basic web presence". La diagnosi era corretta e la causa non era
  tecnica: mancavano i documenti di presentazione, non le funzionalità.

  La ricognizione ha anche misurato due vincoli reali, entrambi indipendenti da
  questo lavoro: la zona è su un piano gratuito, quindi la conversione automatica
  delle pagine in Markdown offerta dal provider non è disponibile; e DNSSEC è
  attivo lato provider ma **inerte**, perché manca il record DS presso il
  registrar — il DNS del servizio oggi non è autenticato.
decision: >
  Pubblicare, come file statici, i descrittori che corrispondono a capacità
  **realmente esistenti**: preferenze sull'uso AI dei contenuti in `robots.txt`,
  un catalogo delle API (RFC 9727) che punta al contratto OpenAPI e all'endpoint
  di stato, una MCP Server Card per il server remoto già in produzione, un indice
  di *agent skills* con due istruzioni operative scritte per gli agenti
  (attestare, verificare), un documento sulle credenziali e una mappa dei link.
  In più, tre strumenti **in sola lettura** esposti alla pagina via WebMCP: stato
  del servizio, verifica della firma di un certificato, ricerca di un'impronta in
  archivio.

  **Il cuore della decisione è però ciò che si è scelto di NON pubblicare.**
  Quattro descrittori che il rilevatore verifica sono stati deliberatamente
  lasciati assenti, perché descriverebbero capacità inesistenti:
  metadati di discovery OAuth/OIDC (non esiste alcun authorization server: OAuth
  è usato solo come client one-shot per leggere un'email verificata, e il device
  flow proprietario non è conforme a RFC 8628); i metadati di risorsa protetta
  OAuth (richiedono l'elenco degli issuer, che non esiste); una A2A Agent Card
  (descriverebbe un agente conversazionale con cui delegare compiti: qui ci sono
  un'API e dei server MCP, cioè strumenti che un agente usa, non un agente); e la
  directory Web Bot Auth (serve a firmare richieste in uscita come bot, e il
  servizio non fa crawling).

  Il criterio, valido oltre questo piano: **un 404 è preferibile a un metadato
  falso.** Un descrittore assente dice "qui non c'è" e il client si adatta; un
  descrittore che mente dice "qui c'è" e poi rompe chi vi si affida. Vale per ogni
  documento di scopribilità, badge o dichiarazione di capacità.

  Coerentemente, nessuno strumento WebMCP attesta: la challenge anti-bot davanti
  all'emissione esiste perché l'attestazione sia un gesto umano, e un tool che la
  aggirasse dalla pagina svuoterebbe quel controllo (stesso non-obiettivo già
  fissato per l'ancoraggio mensile a pulsante).

  Contro il rischio che i descrittori invecchino mentendo — la stessa classe di
  problema di un contratto API rimasto indietro — l'indice delle skill dichiara
  lo SHA-256 di ogni istruzione, con una guardia di CI che fallisce se il testo
  cambia senza che il digest venga riallineato, e un'evidenza settimanale che
  riscarica le skill dal vivo e ricalcola i digest.
consequences: >
  Il livello misurato dal rilevatore esterno passa da 1 a 2, con sette controlli
  soddisfatti. Il livello successivo dipende da **un solo requisito**, la
  negoziazione di contenuto in Markdown, e si è deciso di **non** inseguirlo: non
  solo perché richiederebbe un piano a pagamento o mettere la pagina più visitata
  dietro un servizio applicativo (un rischio di disponibilità per un controllo di
  comodità), ma perché misurerebbe la conversione automatica delle pagine HTML —
  che per un agente è il contenuto meno utile disponibile, dato che le istruzioni
  scritte apposta, il contratto API e la mappa dei link esistono già in forma
  nativa per macchine. Un punteggio più alto non renderebbe il servizio più
  usabile da un solo agente in più.

  Nessun controllo, rischio o trattamento nuovo entra nel registro: sono documenti
  di descrizione, non meccanismi di sicurezza, e non raccolgono nulla. Gli
  strumenti WebMCP chiamano solo endpoint pubblici già esistenti, non
  autenticati, e nessuno di essi crea un'attestazione. Il perimetro dei dati
  personali resta invariato.

  Due questioni restano aperte e registrate come tali, entrambe preesistenti:
  completare DNSSEC aggiungendo il record DS presso il registrar (coerente con un
  ente che pubblica un registro di trasparenza, ma con un margine d'errore che
  renderebbe l'intero dominio irrisolvibile per i resolver validanti, quindi da
  eseguire in una sessione dedicata), e il fatto che le pagine pubbliche carichino
  i propri caratteri tipografici da un fornitore terzo — cosa che espone l'IP di
  ogni visitatore a quel fornitore, mentre altre dipendenze di terze parti sono
  state auto-ospitate proprio per evitarlo.
visibility: public
