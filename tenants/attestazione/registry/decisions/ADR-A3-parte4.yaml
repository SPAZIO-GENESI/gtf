id: ADR-A3-parte4
title: "A3 — Parte 4: rendere visibili sul Trust Center i controlli automatici già attivi (Scorecard, CodeQL, Dependabot)"
date: 2026-08-13
status: accepted
context: >
  A3 (Parti 1-3) era chiusa e verificata con dati reali il 2026-08-13:
  OpenSSF Scorecard raccolto su imgauth (5.7), imgauthweb (5.4),
  autart-signer (2.9); CodeQL verde su cinque repo; `PRC-security-alert-triage`
  registrato. Nessuno di questi fatti era però referenziato da un `CTL`
  nel registro — quindi non compariva su trust.spaziogenesi.org e non
  entrava nel calcolo di `MET-automation`. Il lavoro tecnico era già
  fatto; mancava solo la sua rappresentazione nel registro.
decision: >
  Scritti **due `CTL` separati**, non uno solo, perché misurano cose
  diverse con `verify_howto` diversi: `CTL-scorecard-monitoring`
  (punteggio OpenSSF Scorecard sui tre repo) e `CTL-static-analysis`
  (CodeQL + Dependabot sui cinque repo con codice JS reale). Entrambi
  collegati a `REQ-27001-inspiration-01` (stessa famiglia di
  `CTL-cicd-pipeline`/`CTL-build-provenance`). `PRC-security-alert-triage`
  (già esistente, invariato) resta il riferimento del triage umano,
  citato in prosa nel `verify_howto` di `CTL-static-analysis` — nessun
  campo formale dello schema collega un `CTL` a un `PRC`.

  Due nuovi `EVD` con `collection: auto`: `EVD-scorecard-scores`
  (referenzia `snapshots/2026-W33/scorecard.json`) e
  `EVD-codeql-runs-green` (referenzia i run pubblici di `codeql.yml` sui
  cinque repo). Nessun intervento su `score.mjs`: è il campo
  `collection: auto` a spostare il rapporto automatico/manuale di
  `MET-automation`, non la formula (PRN-07).

  **Correzione rispetto al design doc, verificata prima di scrivere il
  `verify_howto` (PRN-06/§8 del CLAUDE.md di sessione)**: il design doc
  proponeva "la scheda pubblica Security → Code scanning di ciascun
  repo (pubblica di default sui repo pubblici)" come procedura di
  verifica senza credenziali. Verificato con `curl` a ambiente pulito
  che è **falso**: `github.com/<org>/<repo>/security/code-scanning`
  risponde 404 senza sessione autenticata, e l'endpoint REST equivalente
  `api.github.com/.../code-scanning/alerts` risponde 401 — anche su
  repository pubblici. Stessa classe di gotcha già documentata in
  ADR-A1 per `gh attestation verify`. Trovato e verificato un endpoint
  pubblico realmente senza credenziali che copre lo stesso fatto (CodeQL
  verde): `api.github.com/repos/<org>/<repo>/actions/workflows/codeql.yml/runs`
  (200, nessun header Authorization) — usato come `verify_howto`
  primario di `CTL-static-analysis`, con la correzione dichiarata
  esplicitamente nel campo stesso, non silenziata.

  Entrambi i `CTL` nascono **`draft`**: nessuna promozione ad `active`
  decisa in questa sessione (non è la sua autorità, vedi `consequences`)
  — nonostante il collaudo con dati reali sia già avvenuto il
  2026-08-13 sotto supervisione diretta del gestore, la promozione resta
  una decisione sua, da presentare esplicitamente e non da assumere per
  analogia con `CTL-build-provenance`/`CTL-pro-subscription`/
  `CTL-site-voucher-auth` (stesso criterio, applicazione diversa).
consequences: >
  `CTL-scorecard-monitoring` e `CTL-static-analysis` restano `draft`
  finché il gestore non decide esplicitamente la promozione — punto
  presentato nel riepilogo di fine sessione, non deciso qui.
  `PRC-security-alert-triage` non è stato toccato. Nessuna modifica a
  `score.mjs`: se/quanto si sposta `MET-automation` dipende solo
  dall'aver aggiunto due `EVD` reali con `collection: auto`, verificabile
  con `npm run build` dopo il merge.
affects: [CTL-scorecard-monitoring, CTL-static-analysis]
evidence: [EVD-scorecard-scores, EVD-codeql-runs-green]
visibility: public
