id: ADR-B3
title: "B3 — Il rischio dell'indisponibilità del maintainer, reso visibile nel registro"
date: 2026-08-13
status: accepted
context: >
  ADR-GTF-011 aveva emendato la formula di `MET-governance` perché il
  progetto ha un solo maintainer (la revisione tra pari via PR non si
  applica). Quella formula misura la robustezza del *processo* di
  rilascio, non la continuità della *persona* che lo gestisce — due
  domande diverse, nessuna copre l'altra, e il rischio mancava dal
  registro. Concreto, non astratto: la fascia Professionale (P27) vende
  una garanzia contrattuale di custodia a cinque anni sostenuta oggi dalla
  disponibilità continuativa di una sola persona.
decision: >
  Aperti `RSK-maintainer-unavailability` (likelihood medium, impact high
  — nessun secondo referente tecnico individuato oggi) e
  `CTL-maintainer-succession` (nasce `draft`, referenzia
  `piano-2026/umano/procedura-successione.md`, repo privato). Collegato a
  `REQ-27037-pres-01` (conservazione delle prove nel tempo — la prova
  sopravvive all'ente — non `REQ-27043-ir-01`, gestione incidente).

  Ricostruito un inventario delle risorse operative (Cloudflare, Azure,
  organizzazione GitHub, npm, Stripe, backup offsite, bot Telegram,
  registrar) leggendo i repo: tre fatti confermati con verifiche dirette
  read-only (`gh auth status`/`gh api`, `wrangler whoami`, `az account
  show`), il resto marcato "da confermare col gestore" dove nessun file
  lo documentava (registrar, Stripe, BotFather).

  Verificate nel codice, non copiate dalla bozza, le due affermazioni
  tecniche del §6 della procedura: il file `.ots` prodotto da
  `imgauth/worker.js` è un `DetachedTimestampFile` standard sul digest
  reale dell'opera, verificabile con qualunque client OpenTimestamps
  indipendente; il certificato PDF porta una marca temporale di terza
  parte reale (`authart/signer_app/app.py`, DigiCert/AATL). Un terzo
  elemento dato per scontato dalla bozza — un verificatore offline
  dell'integrità del certificato — è risultato non ancora esistente (voce
  A4, `da fare`): la procedura lo dichiara esplicitamente come garanzia
  futura, non presente.

  Preparato ma non configurato un secondo destinatario dell'allarme
  Telegram di `CTL-cadence-monitoring` (parametro opzionale
  `TELEGRAM_CHAT_ID_SECONDARY`, nessun comportamento cambia finché il
  secret non esiste — chi sarà è decisione del gestore).

  `CTL-maintainer-succession` non referenzia oggi alcuna `EVD`,
  deliberatamente: non esiste ancora un'evidenza reale (nessun secondo
  referente, nessun collaudo del recupero segreti da terzi, procedura non
  pubblicata) e inventarne una avrebbe violato l'invariante contro i dati
  non verificati. Lo schema non richiede `evidenced_by` per un controllo
  `draft`.
consequences: >
  `CTL-maintainer-succession` nasce e resta `draft`: nessuno dei
  passaggi umani che chiudono la voce (secondo referente, collaudo
  dell'escrow da terzi, delibera, pubblicazione) è avvenuto.

  Azioni che restano solo al gestore (dettaglio in `STATO.md`, repo
  privato): individuare un secondo referente tecnico o dichiarare per
  iscritto che non esiste; far provare a una persona diversa da sé il
  recupero dei segreti senza aiuto e registrarne l'esito come `EVD`;
  compilare le voci "da confermare"; portare la procedura a delibera;
  pubblicarla; decidere il secondo destinatario dell'allarme.

  Fuori scopo: modifiche alla gestione reale dei segreti; configurazione
  del secondo destinatario; delibera; pubblicazione; promozione del
  controllo ad `active`.
affects: [CTL-maintainer-succession]
visibility: public
