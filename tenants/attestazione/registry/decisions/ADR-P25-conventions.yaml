id: ADR-P25-conventions
title: "P25 (B) — Convenzioni per dominio email: pool mensile dell'ente, degrado mai blocco, log minimizzato"
date: 2026-07-12
status: accepted
context: >
  Il design iniziale prevedeva una quota individuale per membro di
  convenzione. Corretto in revisione: un ente ragiona per monte
  collettivo mensile, non per persona — pool mensile condiviso con un
  tetto individuale come secondo argine anti-drenaggio, non come unità di
  misura primaria. Da decidere anche il comportamento a pool/tetto
  esauriti (scelto il degrado, mai il blocco) e quanto loggare per
  rendere possibile un report all'ente senza estendere il tracciamento su
  un sistema oggi a zero dati personali per chi attesta anonimo.
decision: >
  Contabilità a **pool mensile dell'ente** (`conventions.monthly_quota`,
  `COUNT(*)` su `convention_attestations` per `(convention_id, ym)`,
  Europe/Rome) più **tetto individuale** anti-drenaggio (`member_cap`,
  default 50/mese, stessa soglia del self-service ordinario). Esaurito
  l'uno o l'altro: emissione degradata silenziosamente alla fascia Base
  (certificato comunque emesso, `fascia_motivo: 'pool_esaurito'` o
  `'tetto_individuale'`), mai un 429. Il log `convention_attestations`
  (convenzione→membro→impronta) si scrive solo per le emissioni taggate
  in convenzione — l'unica associazione identità→opere del sistema,
  giustificata caso per caso, non generalizzata.

  Varata `/condizioni/` (pagina pubblica delle fasce): pubblicata
  `noindex` l'11/7 in attesa di delibera assembleare, linkata e
  indicizzata il 12/7 senza attenderla — regole pubbliche prima del
  deploy del meccanismo sottostante, contenuti già scritti invariati.
consequences: >
  Rilasciato lo stesso giorno (imgauth 1.21.0, tag `v1.21.0`, pipeline
  P24 — schema `conventions.sql` su D1 staging e produzione prima della
  promozione). Verificato con login OAuth reale in produzione: prima
  convenzione creata (`spaziogenesi.org`), chiave emessa con
  `convention_id` corretto, riga di log corretta — confermato via query
  diretta su D1, non solo dalla risposta API. `CTL-convention-accounting`
  promosso `draft`→`active`. Risolto lungo il percorso un problema di
  configurazione preesistente non collegato a P25: URI di redirect OAuth
  Google con un carattere iniziale mancante (`redirect_uri_mismatch`).

  Approssimazione nota: il campo `tier` di `meta/cert/<hash>.json`
  riflette l'appartenenza statica della credenziale alla convenzione, non
  l'esito dinamico pool/tetto calcolato al momento di `/api/hash` — un
  certificato degradato a Base può comparire `tier:'convenzione'`.
  Accettato perché `tier` non è ancora consumato da logica di retention
  differenziata; da rivalutare quando lo sarà.

  `/condizioni/` non promette immutabilità dei numeri: le regole possono
  cambiare se/quando l'assemblea delibera, solo l'onestà di quanto già
  vero oggi.
affects: [CTL-convention-accounting, RSK-convention-data-linkage]
evidence: [EVD-git-imgauth]
visibility: public
