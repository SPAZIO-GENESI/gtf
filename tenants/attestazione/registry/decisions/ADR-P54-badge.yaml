id: ADR-P54-badge
title: "P54 — seguito: badge OpenSSF ottenuto e reso visibile sul Trust Center"
date: 2026-08-20
status: accepted
context: >
  `ADR-P54` aveva lasciato il badge OpenSSF Best Practices non sottomesso
  (richiedeva login GitHub del gestore). Compilato il modulo per
  `attest-mcp`: tre criteri erano stati classificati per errore come
  "SHOULD" quando sono "MUST" (`report_responses`,
  `vulnerability_report_response`, `warnings`/`test_policy` — questi
  ultimi due hanno richiesto un fix reale nel codice, non solo testuale).
  `attest-mcp` ha raggiunto il livello "passing"
  (`first_achieved_passing_at: 2026-08-20T08:21:35Z`).
decision: >
  Terzo `CTL` della famiglia iniziata da `ADR-A3-parte4`
  (`CTL-best-practices-badge`), stesso schema: `verify_howto` senza
  credenziali via l'API pubblica di bestpractices.dev, collegato a
  `REQ-27001-inspiration-01`, con `EVD`/`IMP` dedicati. Promosso ad
  `active` lo stesso giorno su decisione esplicita del gestore.

  Verificando la visibilità pubblica del controllo, corretti due difetti
  preesistenti nel generatore del sito: un bug in `linkifyUrls` che
  includeva il backtick di chiusura negli `href` (5 link rotti sulla
  pagina) e 9 legami controllo↔requisito mai collegati (`satisfies`
  dichiarato nel controllo ma assente dal `satisfied_by` del requisito) —
  6 controlli già `active`, mai comparsi pubblicamente per lo stesso
  motivo. Zero orfani residui dopo il fix.
consequences: >
  Il gap sulla pagina `/sicurezza/` di authweb (nessuna menzione di
  Scorecard/CodeQL/badge) resta segnalato ma non affrontato: lavoro più
  ampio su un secondo repo, rimandato dal gestore.
affects: [CTL-best-practices-badge]
evidence: [EVD-best-practices-badge-passing]
visibility: public
