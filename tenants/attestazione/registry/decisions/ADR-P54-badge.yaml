id: ADR-P54-badge
title: "P54 — seguito: rendere visibile sul Trust Center il badge OpenSSF ottenuto"
date: 2026-08-20
status: accepted
context: >
  `ADR-P54` (19/08) aveva chiuso il piano lasciando il badge OpenSSF Best
  Practices non sottomesso — richiedeva il login GitHub del gestore — e
  dichiarava esplicitamente: "un aggiornamento di registro separato va
  fatto dopo" il suo ottenimento. Il 20/08 il gestore ha completato la
  compilazione del modulo insieme all'assistente (bozza in
  `img-auth-hub/p54-f7-badge-attest-mcp.md`), con tre correzioni di rotta
  rispetto a quella bozza (criteri classificati "SHOULD" che erano in
  realtà "MUST": `report_responses`, `vulnerability_report_response`,
  `warnings`/`test_policy` — questi ultimi due hanno richiesto un fix
  reale nel codice, non solo testuale). `attest-mcp` ha raggiunto il
  livello "passing" (`first_achieved_passing_at: 2026-08-20T08:21:35Z`).
  Il gestore ha poi chiesto esplicitamente se il risultato fosse già
  visibile da qualche parte oltre il README del repo: verificato che non
  lo era — né nel Trust Center né sulla pagina pubblica `/sicurezza/` di
  authweb (quest'ultima, notato di passaggio, non menziona nemmeno
  Scorecard/CodeQL benché entrambi attivi da agosto: gap preesistente,
  fuori perimetro di questa voce).
decision: >
  Scritto un terzo `CTL` per la famiglia già iniziata da `ADR-A3-parte4`
  (`CTL-scorecard-monitoring`, `CTL-static-analysis`):
  `CTL-best-practices-badge`, stesso schema — `verify_howto` senza
  credenziali (`bestpractices.dev/projects/14159.json`, REST pubblico),
  collegato a `REQ-27001-inspiration-01`. Un `EVD` con `collection: auto`
  (`EVD-best-practices-badge-passing`) e un `IMP` che referenzia sia il
  badge nel README sia i commit dell'hardening che lo hanno sbloccato
  (ESLint, policy di test).

  **Nasce `draft`**, stessa cautela di `ADR-A3-parte4`: il dato è
  verificato con successo (curl pulito, 20/08), ma la promozione ad
  `active` resta una decisione esplicita del gestore, non assunta per
  analogia con gli altri due controlli della stessa famiglia.
consequences: >
  `CTL-best-practices-badge` resta `draft` finché il gestore non decide
  esplicitamente la promozione. Il gap sulla pagina `/sicurezza/` di
  authweb (nessuna menzione di Scorecard/CodeQL/badge) è stato segnalato
  al gestore in chat ma **non affrontato qui**: è un lavoro più ampio
  (tocca un secondo repo pubblico) che il gestore ha scelto di non fare
  in questo giro.
affects: [CTL-best-practices-badge]
evidence: [EVD-best-practices-badge-passing]
visibility: public
