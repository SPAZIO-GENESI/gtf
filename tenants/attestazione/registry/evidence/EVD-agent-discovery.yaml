integrity: "raccolta settimanale (collect-evidence.mjs): GET (mai HEAD) sui sei documenti, poi verifiche di coerenza — Content-Signal presente in robots.txt, linkset non vuoto nell'api-catalog, serverInfo.name/version + transport.endpoint nella MCP Server Card, intestazione '# auth.md', indice delle skill con almeno una voce. Il controllo determinante è l'ultimo: ogni SKILL.md dichiarato viene RISCARICATO dal vivo e il suo SHA-256 ricalcolato e confrontato con il digest pubblicato nell'indice, così un deploy parziale o un digest non riallineato emergono qui invece di far scartare la skill in silenzio a un agente. NON valida la conformità formale agli standard citati (RFC 9727, SEP-1649, Agent Skills Discovery RFC), che sono in parte bozze in movimento, né il merito del contenuto delle istruzioni."
