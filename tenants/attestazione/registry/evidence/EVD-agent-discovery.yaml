id: EVD-agent-discovery
title: "Documenti e record di scopribilità per agenti coerenti, con i digest delle skill verificati dal vivo e i descrittori rifiutati verificati assenti"
location: { system: authweb + dns, ref: "GET su robots.txt, /.well-known/api-catalog, /.well-known/mcp/server-card.json, /.well-known/agent-skills/index.json, /auth.md, /llms.txt + query SVCB sui record _agents" }
collection: auto
freshness_max_days: 8
last_seen: 2026-08-17
integrity: "raccolta settimanale (collect-evidence.mjs): GET (mai HEAD) sui sei documenti, poi verifiche di coerenza — Content-Signal presente in robots.txt, linkset non vuoto nell'api-catalog, serverInfo.name/version + transport.endpoint nella MCP Server Card, intestazione '# auth.md', indice delle skill con almeno una voce. Il controllo determinante è l'ultimo: ogni SKILL.md dichiarato viene RISCARICATO dal vivo e il suo SHA-256 ricalcolato e confrontato con il digest pubblicato nell'indice, così un deploy parziale o un digest non riallineato emergono qui invece di far scartare la skill in silenzio a un agente. Dal 17/08/2026 verifica anche i record DNS-AID (SVCB sotto `_agents`): che quelli dichiarati esistano con i parametri attesi, e — controllo speculare, altrettanto importante — che **NON** esistano quelli che abbiamo scelto di non pubblicare (`_a2a._agents`, che dichiarerebbe un agente A2A inesistente). È una sorveglianza sulla nostra stessa promessa: se qualcuno lo aggiungesse senza costruire l'agente, se ne accorge il registro invece di un client che fallisce l'handshake. NON valida la conformità formale agli standard citati (RFC 9727, SEP-1649, Agent Skills Discovery RFC, draft DNS-AID), che sono in parte bozze in movimento, né il merito del contenuto delle istruzioni."
supports: [CTL-agent-access]
