id: REQ-gdpr-info-01
source: { norm: GDPR, ref: "art. 13/14 — informativa all'interessato" }
statement: >
  Chi usa il servizio deve poter leggere in modo chiaro cosa viene
  trattato, con quale base giuridica e per quanto tempo.
applicability: full
satisfied_by: [CTL-privacy-policy-public, CTL-dev-selfservice, CTL-telegram-channel, CTL-pro-subscription, CTL-integrations-showcase, CTL-convention-accounting, CTL-site-voucher-auth]
visibility: public
i18n:
  en:
    source_ref: "art. 13/14 — information to the data subject"
    statement: >
      Anyone using the service must be able to clearly read what data is
      processed, on what legal basis, and for how long.
