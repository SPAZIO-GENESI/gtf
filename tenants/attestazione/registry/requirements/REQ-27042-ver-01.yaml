id: REQ-27042-ver-01
source: { norm: "ISO/IEC 27042", ref: "analisi e interpretazione della prova digitale" }
statement: >
  Deve esistere un modo per un terzo di analizzare e interpretare
  l'autenticità di una prova (il certificato) senza doversi fidare
  ciecamente di chi l'ha emessa.
applicability: partial
satisfied_by: [CTL-cert-pdf-verification]
visibility: public
i18n:
  en:
    source_ref: "analysis and interpretation of digital evidence"
    statement: >
      There must be a way for a third party to analyze and interpret the
      authenticity of a piece of evidence (the certificate) without having
      to blindly trust whoever issued it.
