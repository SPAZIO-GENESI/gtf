id: REQ-cad-doc-01
source: { norm: "CAD + Linee guida AgID", ref: "formazione del documento informatico: integrità e riferimento temporale opponibile" }
statement: >
  Il certificato, come documento informatico, deve avere una firma e un
  riferimento temporale che ne rendano opponibile l'integrità nel tempo.
applicability: partial
satisfied_by: [CTL-pades-blt-tsa]
visibility: public
i18n:
  en:
    source_norm: "CAD (Italian Digital Administration Code) + AgID guidelines"
    source_ref: "formation of the electronic document: integrity and legally opposable timestamp"
    statement: >
      The certificate, as an electronic document, must have a signature
      and a timestamp that make its integrity legally opposable over time.
