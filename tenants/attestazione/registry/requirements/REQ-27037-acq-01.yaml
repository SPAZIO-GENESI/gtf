id: REQ-27037-acq-01
source: { norm: "ISO/IEC 27037", ref: "principi di identificazione e acquisizione della prova digitale" }
statement: >
  L'acquisizione dell'impronta digitale dell'opera deve essere documentata
  e riproducibile: algoritmo dichiarato, implementazione ispezionabile.
applicability: partial
satisfied_by: [CTL-hash-client-side, CTL-iso27037-honest-positioning]
visibility: public
i18n:
  en:
    source_ref: "principles of digital evidence identification and acquisition"
    statement: >
      Acquisition of the work's digital fingerprint must be documented and
      reproducible: declared algorithm, inspectable implementation.
