id: REQ-eidas-pos-01
source: { norm: "eIDAS 2.0", ref: "art. 46-equivalente — non discriminazione degli effetti giuridici delle prove elettroniche non qualificate" }
statement: >
  Il servizio deve informare in modo veritiero sul livello di garanzia
  offerto, senza lasciar intendere una qualificazione eIDAS che non
  possiede.
applicability: partial
satisfied_by: [CTL-eidas-honest-positioning]
visibility: public
i18n:
  en:
    source_ref: "art. 46-equivalent — non-discrimination of the legal effects of unqualified electronic evidence"
    statement: >
      The service must truthfully inform users of the level of assurance
      it offers, without implying an eIDAS qualification it does not hold.
