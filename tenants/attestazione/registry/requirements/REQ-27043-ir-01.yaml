id: REQ-27043-ir-01
source: { norm: "ISO/IEC 27043", ref: "processi di investigazione e risposta agli incidenti" }
statement: >
  Deve esistere un processo definito e provato di rilevazione e risposta
  ai guasti/incidenti, non solo una reazione ad hoc.
applicability: partial
satisfied_by: [CTL-availability-monitoring, CTL-responsible-disclosure]
visibility: public
i18n:
  en:
    source_ref: "incident investigation and response processes"
    statement: >
      There must be a defined and tested process for detecting and
      responding to failures/incidents, not just an ad hoc reaction.
