id: PRC-dogfooding-anchor
title: Ancoraggio mensile del registro delle evidenze in Bitcoin
owner: it@spaziogenesi.org
who: Chiunque abbia accesso a GitHub e al servizio; l'attestazione sul sito può farla chiunque abbia accesso al pannello
needs_technical: false
duration_minutes: 20
trigger: "Cadenza mensile (CTL-dogfooding-anchor). La scadenza non si legge da last_run ma dal pacchetto più recente in snapshots/anchors/: è il pacchetto stesso la prova che il mese è stato coperto, quindi non c'è una data da aggiornare a mano e non può divergere dalla realtà."
output: "Un pacchetto <periodo>-bundle.json committato nel registro, attestato sul servizio e ancorato in Bitcoin via OpenTimestamps; impronta e link permanente riportati in EVD-dogfooding-anchor."
produces_evidence: [EVD-dogfooding-anchor]
human_cost_minutes_month: 20
steps:
  - do: "Ogni mese il registro raccoglie una fotografia delle proprie evidenze, una per settimana. Questa procedura le mette insieme in un unico file e le fa attestare dal servizio stesso: da quel momento nessuno — noi compresi — può modificarle a posteriori senza che si veda."
    note: "Non è un passo da eseguire, è cosa stai per fare. I passi veri sono i cinque qui sotto."
  - do: "Premi il pulsante che crea il pacchetto del mese."
    note: "Sulla pagina che si apre, il pulsante verde 'Run workflow' sta in alto a destra: premilo, poi conferma. Il giro dura un paio di minuti. Se GitHub Actions non fosse disponibile, in alternativa si può eseguire da terminale il comando npm run anchor-monthly nella cartella del repository gtf — ma è un ripiego, non il percorso normale."
    links:
      - url: "https://github.com/SPAZIO-GENESI/gtf/actions/workflows/anchor-monthly.yml"
        label: "Crea il pacchetto del mese"
  - do: "Quando il giro è finito, apri il riepilogo del run e scarica il file: il link è già pronto lì dentro, insieme all'impronta del pacchetto."
    note: "Se il pacchetto di questo mese esisteva già, il riepilogo lo dice e mostra comunque l'impronta e il link: va bene lo stesso, non è stato riscritto niente."
  - do: "Attesta quel file. Apri il servizio, scheda Attesta, e scegli il file appena scaricato."
    note: "Questo passo non richiede competenze tecniche: è lo stesso identico giro che fa un utente qualsiasi col proprio lavoro. Serve una persona in carne e ossa perché c'è la verifica anti-robot."
    links:
      - url: "https://attestazione.spaziogenesi.org"
        label: "Vai ad attestare"
  - do: "Genera l'attestazione e scarica il certificato PDF."
    note: "Scaricare il PDF non è facoltativo: è il download che fa partire l'ancoraggio in Bitcoin. Fermarsi all'attestazione non conta come fatto."
  - do: "Controlla che l'impronta stampata sul certificato sia identica a quella del riepilogo."
    note: "Da qui in poi chiunque può ricalcolare l'impronta del file nel repository, confrontarla col certificato e verificare la prova su opentimestamps.org senza chiedere niente a noi. È il motivo per cui questa procedura esiste. Il collettore settimanale si accorge da sé che il pacchetto è stato attestato: non serve aggiornare a mano l'evidenza EVD-dogfooding-anchor."
visibility: public
