id: PRC-dogfooding-anchor
title: Ancoraggio mensile del registro delle evidenze in Bitcoin
owner: it@spaziogenesi.org
who: Il gestore per la parte tecnica; l'attestazione sul sito può farla chiunque abbia accesso al pannello
needs_technical: true
duration_minutes: 20
trigger: "Cadenza mensile (CTL-dogfooding-anchor). La scadenza non si legge da last_run ma dal pacchetto più recente in snapshots/anchors/: è il pacchetto stesso la prova che il mese è stato coperto, quindi non c'è una data da aggiornare a mano e non può divergere dalla realtà."
output: "Un pacchetto <periodo>-bundle.json committato nel registro, attestato sul servizio e ancorato in Bitcoin via OpenTimestamps; impronta e link permanente riportati in EVD-dogfooding-anchor."
produces_evidence: [EVD-dogfooding-anchor]
human_cost_minutes_month: 20
steps:
  - do: "Ogni mese il registro raccoglie una fotografia delle proprie evidenze, una per settimana. Questa procedura le mette insieme in un unico file e le fa attestare dal servizio stesso: da quel momento nessuno — noi compresi — può modificarle a posteriori senza che si veda."
    note: "Non è un passo da eseguire, è cosa stai per fare. I passi veri sono i quattro qui sotto."
  - do: "Crea il file del mese. Sul computer del gestore, apri il Terminale, entra nella cartella del repository gtf ed esegui il comando: npm run anchor-monthly"
    note: "La cartella giusta è quella che contiene il file package.json e la cartella tenants; sul computer del gestore è dentro spazio_genesi. Se non ce l'hai in locale, la scarichi con: git clone https://github.com/SPAZIO-GENESI/gtf.git — e la prima volta, dentro la cartella, esegui anche: npm install. Il comando non manda niente a nessuno e non modifica il registro: crea solo un file nuovo dentro tenants/attestazione/snapshots/anchors/, con nome tipo 2026-08-bundle.json. A schermo stampa il nome del file e la sua impronta: copiala, serve al passo 4."
  - do: "Attesta quel file. Apri il servizio, scheda Attesta, e scegli il file appena creato."
    note: "Questo passo non richiede competenze tecniche: è lo stesso identico giro che fa un utente qualsiasi col proprio lavoro. Serve una persona in carne e ossa perché c'è la verifica anti-robot."
    links:
      - url: "https://attestazione.spaziogenesi.org"
        label: "Vai ad attestare"
  - do: "Genera l'attestazione e scarica il certificato PDF."
    note: "Scaricare il PDF non è facoltativo: è il download che fa partire l'ancoraggio in Bitcoin. Fermarsi all'attestazione non conta come fatto."
  - do: "Controlla che l'impronta stampata sul certificato sia identica a quella copiata al passo 2."
  - do: "Salva il file nel registro (git add, commit e push) e riporta impronta e link permanente del certificato nell'evidenza EVD-dogfooding-anchor."
    note: "Da qui in poi chiunque può ricalcolare l'impronta del file nel repository, confrontarla col certificato e verificare la prova su opentimestamps.org senza chiedere niente a noi. È il motivo per cui questa procedura esiste."
    links:
      - url: "https://github.com/SPAZIO-GENESI/gtf/blob/main/tenants/attestazione/registry/evidence/EVD-dogfooding-anchor.yaml"
        label: "L'evidenza da aggiornare"
visibility: public
