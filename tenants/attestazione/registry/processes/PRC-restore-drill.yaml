id: PRC-restore-drill
title: Prova periodica di ripristino da backup
owner: maintainer del servizio
trigger: "cadenza semestrale (GTF-ARCH §9.3)"
output: "verbale della prova di ripristino (riuscita/fallita, tempo impiegato, eventuali correzioni al piano)"
produces_evidence: [EVD-backup-resilience]
human_cost_minutes_month: 10
frequency_days: 180
last_run: "2026-07-19"
last_outcome: ok
who: Il gestore
needs_technical: true
duration_minutes: 90
steps:
  - do: "Scegli tre opere già attestate di periodi diversi: una recente, una dei primi mesi, una con l'ancoraggio Bitcoin ormai maturo."
  - do: "Scarica quelle tre dal backup esterno (non dall'archivio di produzione: è il backup che si sta provando)."
  - do: "Su ciascuna, verifica tre cose indipendenti: che la firma estratta dal certificato sia valida, che la prova di ancoraggio regga contro un blocco Bitcoin reale, e che il badge pubblico dell'opera risulti verde."
    note: "Se una sola delle tre fallisce, la prova è fallita: va scritto così nel verbale, non ammorbidito."
  - do: "Cancella i file ripristinati: non devono finire in nessun repository."
  - do: "Scrivi il verbale in docs/verbali/ e aggiorna last_run e last_outcome in questo file."
    note: "Il verbale va scritto anche quando è andato tutto bene: una prova senza verbale non è dimostrabile a nessuno."
    link: "https://github.com/SPAZIO-GENESI/gtf/edit/main/tenants/attestazione/registry/processes/PRC-restore-drill.yaml"
    link_label: "Apri il file da aggiornare"
visibility: public
