id: PRC-permanent-archival-refresh
title: "Riarchiviazione trimestrale su Software Heritage e cattura su Internet Archive"
owner: it@spaziogenesi.org
who: "Chiunque abbia accesso a un browser — nessuna credenziale richiesta su nessuno dei due servizi"
needs_technical: false
duration_minutes: 15
trigger: "Cadenza trimestrale dichiarata, non assunta: Software Heritage ripassa da sé sui repository che segue, ma non esiste una garanzia pubblica sulla cadenza per repository a basso traffico come i nostri — quindi si dichiara una riarchiviazione trimestrale invece di fidarsi di una ripassata automatica non verificabile (stessa logica già applicata alla cattura Internet Archive, PRN-10: una cattura manuale dichiarata costa meno di uno script da mantenere)."
output: "Otto SWHID (uno per repository) e due catture Internet Archive aggiornati, riportati in EVD-swh-archival-verify e EVD-ia-capture-verify."
produces_evidence: [EVD-swh-archival-verify, EVD-ia-capture-verify]
human_cost_minutes_month: 5
frequency_days: 90
last_run: "2026-08-20"
last_outcome: ok
steps:
  - do: "Per ciascuno degli otto repository pubblici del sistema di attestazione, apri la pagina di archiviazione di Software Heritage e incolla l'indirizzo del repository."
    note: "Sono solo questi otto, non l'intera organizzazione GitHub: imgauth, imgauthweb, autart-signer, gtf, attest-mcp, attest-mcp-remote, attest-action, attest-bot. Il resto dell'organizzazione (siti-portfolio personali, repository di test) resta fuori — vedi ADR-A5."
    links:
      - url: "https://archive.softwareheritage.org/save/"
        label: "Software Heritage — Save code now"
  - do: "Attendi il completamento (di solito pochi secondi) e copia lo SWHID risultante per ciascun repository."
    note: "Aggiorna EVD-swh-archival-verify col nuovo SWHID solo se è cambiato rispetto all'ultimo registrato: un repository senza commit nuovi produce lo stesso identico SWHID, e non c'è nulla da riscrivere."
  - do: "Cattura le due pagine pubbliche del servizio su Internet Archive."
    note: "Basta incollare l'indirizzo nel modulo — nessun account necessario."
    links:
      - url: "https://web.archive.org/save/https://trust.spaziogenesi.org"
        label: "Cattura trust.spaziogenesi.org"
      - url: "https://web.archive.org/save/https://attestazione.spaziogenesi.org"
        label: "Cattura attestazione.spaziogenesi.org"
  - do: "Aggiorna gli indirizzi delle catture in EVD-ia-capture-verify e la data last_run di questo file."
visibility: public
