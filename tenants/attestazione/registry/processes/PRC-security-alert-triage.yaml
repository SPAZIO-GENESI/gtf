id: PRC-security-alert-triage
title: Triage settimanale degli alert di sicurezza (CodeQL, Dependabot)
owner: it@spaziogenesi.org
who: Federico Battisti — presidente
needs_technical: false
duration_minutes: 15
trigger: "Cadenza fissa settimanale, non un evento: Federico Battisti (Presidente, secondo referente tecnico dell'ente — vedi B3/piano P43) controlla la scheda Security > Code scanning e Dependabot di imgauth, imgauthweb, attest-mcp, attest-bot, attest-mcp-remote. Alert nel suo raggio di competenza tecnica: chiude o corregge direttamente. Alert critici o fuori portata: escalation al gestore (it@spaziogenesi.org)."
output: "Ogni alert aperto ha un esito entro la settimana successiva — chiuso, corretto, o segnalato al gestore con una ACT (PRN-09) — mai lasciato silenzioso."
human_cost_minutes_month: 60
frequency_days: 7
last_run: "2026-08-17"
last_outcome: ok
steps:
  - do: "Apri, uno alla volta, gli avvisi sul nostro codice dei cinque programmi."
    note: "I link sono già filtrati: mostrano solo gli avvisi del controllo automatico del codice. Le voci con la sigla Scorecard restano fuori — sono suggerimenti di buone pratiche, non difetti, e le gestisce il gestore. Non esiste una pagina unica che li raccolga tutti: richiede un piano GitHub a pagamento che non abbiamo."
    links:
      - url: "https://github.com/SPAZIO-GENESI/imgauth/security/code-scanning?query=is%3Aopen+tool%3ACodeQL"
        label: "imgauth (il motore)"
      - url: "https://github.com/SPAZIO-GENESI/imgauthweb/security/code-scanning?query=is%3Aopen+tool%3ACodeQL"
        label: "imgauthweb (il sito)"
      - url: "https://github.com/SPAZIO-GENESI/attest-mcp/security/code-scanning?query=is%3Aopen+tool%3ACodeQL"
        label: "attest-mcp"
      - url: "https://github.com/SPAZIO-GENESI/attest-bot/security/code-scanning?query=is%3Aopen+tool%3ACodeQL"
        label: "attest-bot (il bot Telegram)"
      - url: "https://github.com/SPAZIO-GENESI/attest-mcp-remote/security/code-scanning?query=is%3Aopen+tool%3ACodeQL"
        label: "attest-mcp-remote"
  - do: "Apri poi gli avvisi sulle librerie di altri che usiamo, sempre nei cinque programmi."
    note: "Questi sono di solito i più seri: segnalano che una libreria scritta da altri, e che noi usiamo, ha un difetto di sicurezza già noto al mondo. La sorveglianza è accesa su tutti e cinque, quindi un elenco vuoto significa davvero che non c'è niente."
    links:
      - url: "https://github.com/SPAZIO-GENESI/imgauth/security/dependabot?q=is%3Aopen"
        label: "imgauth (il motore)"
      - url: "https://github.com/SPAZIO-GENESI/imgauthweb/security/dependabot?q=is%3Aopen"
        label: "imgauthweb (il sito)"
      - url: "https://github.com/SPAZIO-GENESI/attest-mcp/security/dependabot?q=is%3Aopen"
        label: "attest-mcp"
      - url: "https://github.com/SPAZIO-GENESI/attest-bot/security/dependabot?q=is%3Aopen"
        label: "attest-bot (il bot Telegram)"
      - url: "https://github.com/SPAZIO-GENESI/attest-mcp-remote/security/dependabot?q=is%3Aopen"
        label: "attest-mcp-remote"
  - do: "Se non è comparso niente di nuovo rispetto alla settimana scorsa, hai finito: salta all'ultimo passo."
  - do: "Se è comparso qualcosa di nuovo, non chiuderlo e non toccare il codice: copia il titolo dell'avviso e il nome del programma, e mandali al gestore su Telegram."
    note: "Chiudere un avviso senza aver capito cosa dice è l'unico errore davvero costoso: sparisce dall'elenco e nessuno lo guarda più."
  - do: "Segna che l'hai fatto: apri il file qui sotto, tocca l'icona della matita in alto a destra, cambia la data della riga last_run con quella di oggi (nella forma 2026-08-17) e salva col pulsante verde Commit changes."
    note: "È l'unico modo per fermare l'avviso settimanale su Telegram: finché la data resta vecchia, il bot continua a segnalare la scadenza."
    links:
      - url: "https://github.com/SPAZIO-GENESI/gtf/edit/main/tenants/attestazione/registry/processes/PRC-security-alert-triage.yaml"
        label: "Apri il file da aggiornare"
visibility: public
