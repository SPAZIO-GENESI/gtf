id: PRN-05
type: principle
title: Privacy by Design
statement: >
  Ogni flusso di dati personali è mappato, con base giuridica e retention
  dichiarate, prima ancora di essere costruito — non dopo.
rule: >
  Ogni flusso di dati ha un record DAT (dato, base giuridica, retention);
  un flusso senza DAT fa fallire la build.
derives_from: MSN-01
status: active
visibility: public
i18n:
  en:
    statement: >
      Every personal data flow is mapped, with legal basis and retention
      declared, before it is even built — not after.
    rule: >
      Every data flow has a DAT record (data, legal basis, retention); a
      flow without a DAT fails the build.
