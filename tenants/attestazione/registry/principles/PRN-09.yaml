id: PRN-09
type: principle
title: Continuous Improvement
statement: >
  Un incidente senza un'azione correttiva è un incidente destinato a
  ripetersi; il sistema non permette che accada senza segnalarlo.
rule: >
  Ogni incidente (INC) produce ≥1 azione (ACT) con scadenza; le ACT scadute
  e ancora aperte mostrano un banner nel Trust Center.
derives_from: MSN-01
status: active
visibility: public
i18n:
  en:
    statement: >
      An incident without a corrective action is an incident bound to
      repeat; the system does not let this happen without flagging it.
    rule: >
      Every incident (INC) produces ≥1 action (ACT) with a deadline;
      overdue and still-open ACTs show a banner in the Trust Center.
