id: PRN-06
type: principle
title: Governance by Design
statement: >
  Ogni modifica al registro passa da revisione; le decisioni non ovvie
  lasciano una traccia esplicita, non solo un commit.
rule: >
  Ogni modifica al registro passa da PR; le decisioni non ovvie richiedono
  un'ADR obbligatoria (l'etichetta `needs-adr` blocca il merge finché non c'è).
derives_from: MSN-01
status: active
visibility: public
i18n:
  en:
    statement: >
      Every change to the registry goes through review; non-obvious
      decisions leave an explicit trace, not just a commit.
    rule: >
      Every change to the registry goes through a PR; non-obvious
      decisions require a mandatory ADR (the `needs-adr` label blocks the
      merge until one exists).
