id: PRN-08
type: principle
title: Open Verification
statement: >
  Ogni affermazione pubblica porta con sé il modo per un terzo di verificarla
  da solo, senza credenziali e senza doverci credere.
rule: >
  Per ogni affermazione pubblica esiste uno script o una procedura eseguibile
  da terzi senza credenziali (`verify_howto` obbligatorio sui controlli
  pubblici).
derives_from: MSN-01
status: active
visibility: public
i18n:
  en:
    statement: >
      Every public claim carries with it a way for a third party to
      verify it independently, without credentials and without having to
      take it on faith.
    rule: >
      For every public claim there is a script or procedure a third
      party can run without credentials (`verify_howto` is mandatory on
      public controls).
