id: CTL-pro-subscription
title: "Fascia Professionale: abbonamento Stripe (Checkout/Portal hosted, nessun dato di carta sul Worker), pagina profilo, listino/sconti gestiti in D1"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01, REQ-gdpr-info-01, REQ-gdpr-min-01, REQ-gdpr-rights-01]
mitigates: [RSK-payment-integration, RSK-profiling-data]
implemented_by: [IMP-imgauth-pro-subscription]
evidenced_by: [EVD-pro-subscription-live-test, EVD-git-imgauth, EVD-git-imgauthweb]
verify_howto: >
  Apri attestazione.spaziogenesi.org/profilo/ (P29: guscio statico su
  authweb, fetch verso imgauth), accedi con un login OAuth one-shot
  (Google/Microsoft/LinkedIn — stesso meccanismo di CTL-dev-selfservice e
  CTL-site-voucher-auth, nessuna password, nessun account). Senza
  abbonamento: prezzo del listino attivo mostrato dinamicamente (mai
  hardcodato) e bottone Checkout, che apre una pagina Stripe hosted — nessun
  campo carta compare mai su imgauth.spaziogenesi.org. Con un abbonamento
  attivo: stato, scadenza, log ricariche, consumo del mese, archivio dei
  certificati con canale di produzione (web/api/mcp/telegram), bottone
  "Gestisci o cessa l'abbonamento" che apre lo Stripe Customer Portal
  hosted (fatture, metodo di pagamento, cessazione — mai su questo
  Worker). Una cessazione dal Portal (comportamento di default per
  abbonamenti annuali: resta attivo fino alla scadenza già pagata) mostra
  un banner "cessazione programmata" senza perdere la fascia. La catena di
  precedenza convenzione→professionale→sviluppatore→base non blocca mai:
  quota o abbonamento esauriti degradano a Base con motivo esplicito
  (`fascia_motivo`), stessa logica già verificata per
  CTL-convention-accounting. Il listino e i codici sconto si gestiscono dal
  pannello /admin (scheda Professionale): righe con finestre di validità
  (mai si modifica un importo passato, si chiude e se ne crea una nuova) e
  sconti percentuali/fissi, anche riservati a una singola email.
  ✅ Collaudato con un **abbonamento reale a pagamento** (1€, non un dato
  sintetico) end-to-end in produzione il 17-18 luglio 2026 — vedi
  EVD-pro-subscription-live-test: checkout → attestazione dal sito
  riconosciuta in fascia professionale → archivio con canale → cessazione
  dal Customer Portal → rimborso. Nel collaudo emersi e corretti tre difetti
  reali mai incontrati nei test locali (shape dell'API Stripe
  dell'account, `cancel_at_period_end` sempre `false`, doppio evento del
  Customer Portal per un click) — vedi ADR-P27. Nasce direttamente `active`,
  stesso criterio già applicato a CTL-cicd-pipeline, CTL-site-voucher-auth
  e CTL-convention-accounting: un controllo collaudato con dati reali, non
  solo dichiarato.
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-07-18
i18n:
  en:
    title: "Professional tier: Stripe subscription (hosted Checkout/Portal, no card data on the Worker), profile page, pricing/discounts managed in D1"
    verify_howto: >
      Open attestazione.spaziogenesi.org/profilo/ (P29: static shell on
      authweb, fetching from imgauth), sign in with a one-shot OAuth
      login (Google/Microsoft/LinkedIn — same mechanism as
      CTL-dev-selfservice and CTL-site-voucher-auth, no password, no
      account). Without a subscription: the active price list is shown
      dynamically (never hardcoded) with a Checkout button that opens a
      hosted Stripe page — no card field ever appears on
      imgauth.spaziogenesi.org. With an active subscription: status,
      expiry, top-up log, this month's usage, a certificate archive with
      production channel (web/api/mcp/telegram), a "Manage or cancel
      subscription" button that opens the hosted Stripe Customer Portal
      (invoices, payment method, cancellation — never on this Worker).
      Cancelling from the Portal (default behavior for annual
      subscriptions: stays active until the already-paid expiry) shows a
      "cancellation scheduled" banner without losing the tier. The
      convention→professional→developer→base precedence chain never
      blocks: an exhausted quota or subscription degrades to Base with
      an explicit reason (`fascia_motivo`), the same logic already
      verified for CTL-convention-accounting. The price list and
      discount codes are managed from the /admin panel (Professional
      tab): rows with validity windows (a past amount is never edited,
      it is closed and a new one created) and percentage/fixed
      discounts, even reserved to a single email.
      ✅ Tested with a **real, paid subscription** (€1, not synthetic
      data) end-to-end in production on 17-18 July 2026 — see
      EVD-pro-subscription-live-test: checkout → attestation from the
      site recognized at the professional tier → archive with channel →
      cancellation from the Customer Portal → refund. The test surfaced
      and fixed three real defects never encountered in local tests (the
      account's Stripe API shape, `cancel_at_period_end` always `false`,
      a duplicate Customer Portal event for one click) — see ADR-P27. It
      is born directly `active`, the same criterion already applied to
      CTL-cicd-pipeline, CTL-site-voucher-auth and
      CTL-convention-accounting: a control tested with real data, not
      just declared.
