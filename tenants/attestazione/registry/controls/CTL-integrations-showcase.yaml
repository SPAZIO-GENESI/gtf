id: CTL-integrations-showcase
title: "Vetrina pubblica Integrazioni (pre-moderata) + convenzioni partner software house con pool mensile"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01, REQ-gdpr-info-01, REQ-gdpr-min-01, REQ-gdpr-rights-01]
mitigates: [RSK-third-party-content]
implemented_by: [IMP-imgauth-integrations-showcase]
evidenced_by: [EVD-integrations-showcase, EVD-git-imgauth, EVD-git-imgauthweb]
verify_howto: >
  Apri attestazione.spaziogenesi.org/integrazioni/ (P29: pagina statica su
  authweb, rigenerata a evento da imgauth): vetrina pubblica, solo le
  candidature approvate compaiono (logo, nome, descrizione, link
  `rel="noopener nofollow"`), con conteggio totale e spiegazione onesta che
  la presenza non è una certificazione del software. Chi ha una chiave API
  attiva o un abbonamento Professionale può candidare la propria
  applicazione dalla sezione "La tua integrazione" di
  attestazione.spaziogenesi.org/profilo/ (stesso login OAuth one-shot di
  CTL-dev-selfservice e CTL-pro-subscription): la candidatura risulta
  subito `pending`, mai pubblica finché il gestore non la approva dal
  pannello /admin (scheda Integrazioni) — pre-moderazione, a differenza di
  ogni altro flusso self-service del sistema. Qualunque modifica successiva
  — nome, URL, descrizione o solo il logo — riporta lo stato a `pending`:
  non esiste un canale per cambiare silenziosamente ciò che è già online.
  Il logo, se presente, è servito solo per le candidature approvate
  (`GET /integrazioni/logo/<id>`, 404 altrimenti) ed è stato validato
  all'upload sui magic bytes (PNG/JPEG/WebP, mai SVG, mai il Content-Type
  dichiarato). Le software house che attestano per conto dei propri utenti
  usano una convenzione con pool mensile dedicato (`convention_id` sulla
  chiave, `domains` placeholder che non può mai combaciare con un'email
  reale) — stesso meccanismo di CTL-convention-accounting, riusato senza
  nuovo codice sul motore. Il "forget" GDPR del pannello admin anonimizza
  anche il titolare di una candidatura e la ritira dalla vetrina.
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-07-18
i18n:
  en:
    title: "Public Integrations showcase (pre-moderated) + software-house partner conventions with a monthly pool"
    verify_howto: >
      Open attestazione.spaziogenesi.org/integrazioni/ (P29: static page
      on authweb, regenerated on-event by imgauth): public showcase,
      only approved submissions appear (logo, name, description,
      `rel="noopener nofollow"` link), with a total count and an honest
      note that presence is not a certification of the software. Anyone
      with an active API key or a Professional subscription can submit
      their own application from the "Your integration" section of
      attestazione.spaziogenesi.org/profilo/ (same one-shot OAuth login
      as CTL-dev-selfservice and CTL-pro-subscription): the submission
      is immediately `pending`, never public until the maintainer
      approves it from the /admin panel (Integrations tab) —
      pre-moderation, unlike every other self-service flow in the
      system. Any later change — name, URL, description, or just the
      logo — sends the status back to `pending`: there is no channel to
      silently change what is already live. The logo, if present, is
      served only for approved submissions (`GET
      /integrazioni/logo/<id>`, 404 otherwise) and was validated on
      upload against magic bytes (PNG/JPEG/WebP, never SVG, never the
      declared Content-Type). Software houses attesting on behalf of
      their own users use a convention with a dedicated monthly pool
      (`convention_id` on the key, `domains` placeholder that can never
      match a real email) — the same mechanism as
      CTL-convention-accounting, reused with no new engine code. The
      admin panel's GDPR "forget" also anonymizes a submission's holder
      and withdraws it from the showcase.
