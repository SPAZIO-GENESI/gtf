id: CTL-hmac-signing
title: "Token HMAC che vincola hash, timestamp server-side e metadati dichiarati"
status: active
visibility: public
satisfies: [PRN-04]
mitigates: [RSK-cert-forgery]
implemented_by: [IMP-imgauth-hmac, IMP-imgauth-cert-pdf-verify, IMP-imgauth-runchecks-hmac-probe, IMP-imgauth-api-verify]
evidenced_by: [EVD-status-live, EVD-git-imgauth]
verify_howto: >
  Prova a chiamare /api/cert-pdf con un hash o timestamp diverso da quello
  restituito da /api/hash: la richiesta viene rifiutata (400/403). Lo stato
  del componente "worker" su /api/status riflette anche l'esito della sonda
  HMAC interna.
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-07-09
i18n:
  en:
    title: "HMAC token binding the hash, server-side timestamp, and declared metadata"
    verify_howto: >
      Try calling /api/cert-pdf with a hash or timestamp different from
      the one returned by /api/hash: the request is rejected (400/403).
      The "worker" component's status on /api/status also reflects the
      outcome of the internal HMAC probe.
