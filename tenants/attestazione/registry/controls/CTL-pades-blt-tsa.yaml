id: CTL-pades-blt-tsa
title: "Firma PAdES B-LT con marca temporale RFC 3161 da TSA riconosciuta (Adobe AATL)"
status: active
visibility: public
satisfies: [REQ-cad-doc-01]
mitigates: [RSK-cert-forgery]
implemented_by: [IMP-authart-pades-tsa]
evidenced_by: [EVD-git-authart]
verify_howto: >
  Apri un certificato PDF emesso in Adobe Acrobat (o un lettore PAdES
  conforme): il pannello firme mostra la marca temporale da terza parte
  attendibile (Adobe AATL), verificabile senza fidarsi del servizio.
  Dal 2026-07-09 il codice che genera la firma è anche direttamente
  ispezionabile: github.com/SPAZIO-GENESI/autart-signer (AGPL-3.0).
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-07-09
i18n:
  en:
    title: "PAdES B-LT signature with an RFC 3161 timestamp from a recognized TSA (Adobe AATL)"
    verify_howto: >
      Open an issued PDF certificate in Adobe Acrobat (or a
      PAdES-compliant reader): the signature panel shows the timestamp
      from a trusted third party (Adobe AATL), verifiable without
      trusting the service. Since 2026-07-09 the code that generates the
      signature is also directly inspectable:
      github.com/SPAZIO-GENESI/autart-signer (AGPL-3.0).
