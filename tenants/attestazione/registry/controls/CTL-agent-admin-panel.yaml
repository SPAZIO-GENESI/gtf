id: CTL-agent-admin-panel
title: "Pannello admin credenziali agente: elenco/emissione/revoca/quota con accesso riservato"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01]
mitigates: [RSK-admin-panel-weak-auth]
implemented_by: [IMP-imgauth-admin-panel]
evidenced_by: [EVD-git-imgauth]
verify_howto: >
  L'accesso al pannello e alle sue funzioni di gestione è riservato al
  gestore e protetto in profondità (Cloudflare Access a monte più protezione
  applicativa — vedi CTL-cloudflare-access-admin e ADR-P21-admin-cfaccess).
  L'effetto delle operazioni di gestione è osservabile in modo indiretto:
  una credenziale emessa autentica su /api/hash, una revocata riceve 403.
  Il perimetro non tocca in alcun caso l'emissione dei certificati.
owner: it@spaziogenesi.org
review_every_days: 90
last_reviewed: 2026-07-19
i18n:
  en:
    title: "Agent credential admin panel: list/issue/revoke/quota with restricted access"
    verify_howto: >
      Access to the panel and its management functions is restricted to
      the maintainer and defense-in-depth protected (Cloudflare Access
      upstream plus application-level protection — see
      CTL-cloudflare-access-admin and ADR-P21-admin-cfaccess). The effect
      of management operations is observable indirectly: an issued
      credential authenticates on /api/hash, a revoked one gets 403. The
      perimeter never touches certificate issuance in any way.
