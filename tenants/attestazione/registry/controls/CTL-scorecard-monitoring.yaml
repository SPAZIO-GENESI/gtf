id: CTL-scorecard-monitoring
title: "Monitoraggio pubblico della postura di sicurezza via OpenSSF Scorecard (A3)"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01]
implemented_by: [IMP-imgauth-scorecard, IMP-imgauthweb-scorecard, IMP-autart-signer-scorecard]
evidenced_by: [EVD-scorecard-scores]
verify_howto: >
  Senza alcuna credenziale: `curl
  https://api.securityscorecards.dev/projects/github.com/SPAZIO-GENESI/imgauth`
  (e allo stesso modo per `/SPAZIO-GENESI/imgauthweb` e
  `/SPAZIO-GENESI/autart-signer`) restituisce il punteggio pubblico
  OpenSSF Scorecard più recente con la scomposizione per singolo check
  (Dependency-Update-Tool, Maintained, Dangerous-Workflow,
  Token-Permissions, Pinned-Dependencies, ecc.). Primo dato reale
  raccolto il 2026-08-13: imgauth 5.7/10, imgauthweb 5.4/10, autart-signer
  2.9/10. Stesso giorno, in un secondo giro: branch protection attivata sui
  tre repo (no force-push, no cancellazione branch, status check `check`
  richiesto dove esiste — imgauth/imgauthweb; assente su autart-signer, che
  non ha alcun workflow su `pull_request`) e fine-grained PAT
  (`SCORECARD_TOKEN`, solo `Administration:Read-only`) aggiunto a
  `scorecard.yml` perché il `GITHUB_TOKEN` di default non può leggere le
  regole di branch protection — senza, il check Branch-Protection andava in
  errore (-1, escluso dal punteggio) invece di essere valutato. Con il
  fix: imgauth 7.6/10, imgauthweb 7.6/10, autart-signer 5.6/10,
  Branch-Protection 3/10 su tutti e tre ("not maximal": manca la PR
  obbligatoria, scartata di proposito perché il flusso di lavoro reale è a
  push diretto su main). Ogni repo ha un workflow schedulato settimanale
  (`scorecard.yml`, `workflow_dispatch` per un run manuale) che pubblica
  il risultato anche sul tab "Security → Code scanning" di GitHub — quella
  pagina però **richiede una sessione GitHub autenticata anche su repository
  pubblici** (verificato: `curl` a `github.com/.../security/code-scanning`
  senza credenziali risponde 404, e l'endpoint REST equivalente
  `api.github.com/.../code-scanning/alerts` risponde 401) — stesso tipo di
  limite del client `gh` già documentato in `CTL-build-provenance`/ADR-A1.
  L'API pubblica di securityscorecards.dev, usata sopra, non ha questo
  limite ed è la via primaria di verifica di questo controllo.

  **Aggiornamento 2026-08-19 (P54/F8)**: la protezione base (no
  force-push, no cancellazione branch) è stata estesa da questi tre repo
  ad `attest-mcp`, `attest-bot`, `attest-mcp-remote` — verificato con
  `curl` che tutti e sei ora hanno la stessa configurazione. **Nessuna PR
  obbligatoria su nessuno dei sei**: il gestore, ririchiesto
  esplicitamente vista la scelta del 13/08, ha confermato di voler
  mantenere il push diretto su main. Gli alert Scorecard
  `BranchProtectionID`/`CodeReviewID` restano quindi aperti per scelta
  dichiarata su tutti e sei i repo, non solo sui tre originari.
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-08-19
# 2026-08-13, secondo giro: branch protection + fine-grained PAT
# SCORECARD_TOKEN aggiunti (vedi verify_howto). Aggiornamento di
# evidenza su un controllo già active, non una promozione.
# 2026-08-19 (P54/F8): stessa protezione base estesa ad attest-mcp,
# attest-bot, attest-mcp-remote — vedi ADR-P54.
i18n:
  en:
    title: "Public monitoring of security posture via OpenSSF Scorecard (A3)"
    verify_howto: >
      Without any credential: `curl
      https://api.securityscorecards.dev/projects/github.com/SPAZIO-GENESI/imgauth`
      (and likewise for `/SPAZIO-GENESI/imgauthweb` and
      `/SPAZIO-GENESI/autart-signer`) returns the most recent public
      OpenSSF Scorecard score with the per-check breakdown
      (Dependency-Update-Tool, Maintained, Dangerous-Workflow,
      Token-Permissions, Pinned-Dependencies, etc.). First real data
      collected on 2026-08-13: imgauth 5.7/10, imgauthweb 5.4/10,
      autart-signer 2.9/10. Same day, in a second pass: branch
      protection enabled on all three repos (no force-push, no branch
      deletion, `check` status check required where it exists —
      imgauth/imgauthweb; absent on autart-signer, which has no workflow
      on `pull_request`) and a fine-grained PAT (`SCORECARD_TOKEN`,
      `Administration:Read-only` only) added to `scorecard.yml` because
      the default `GITHUB_TOKEN` cannot read branch protection rules —
      without it, the Branch-Protection check errored out (-1, excluded
      from the score) instead of being evaluated. With the fix: imgauth
      7.6/10, imgauthweb 7.6/10, autart-signer 5.6/10, Branch-Protection
      3/10 on all three ("not maximal": mandatory PR review is missing,
      deliberately skipped because the actual workflow is direct push to
      main). Every repo has a weekly scheduled workflow (`scorecard.yml`,
      `workflow_dispatch` for a manual run) that also publishes the
      result on GitHub's "Security → Code scanning" tab — that page,
      however, **requires an authenticated GitHub session even on
      public repositories** (verified: `curl` on
      `github.com/.../security/code-scanning` without credentials
      returns 404, and the equivalent REST endpoint
      `api.github.com/.../code-scanning/alerts` returns 401) — the same
      kind of client limitation already documented in
      `CTL-build-provenance`/ADR-A1. The public securityscorecards.dev
      API used above does not have this limitation and is the primary
      way to verify this control.

      **2026-08-19 update (P54/F8)**: baseline protection (no force-push,
      no branch deletion) was extended from these three repos to
      `attest-mcp`, `attest-bot`, `attest-mcp-remote` — verified with
      `curl` that all six now share the same configuration. **No PR is
      required on any of the six**: the maintainer, asked again
      explicitly given the 08-13 choice, confirmed wanting to keep
      direct pushes to main. The Scorecard `BranchProtectionID`/
      `CodeReviewID` alerts therefore stay open by declared choice on
      all six repos, not just the original three.
