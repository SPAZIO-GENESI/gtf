id: CTL-scorecard-monitoring
title: "Monitoraggio pubblico della postura di sicurezza via OpenSSF Scorecard (A3)"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01]
implemented_by: [IMP-imgauth-scorecard, IMP-imgauthweb-scorecard, IMP-autart-signer-scorecard]
evidenced_by: [EVD-scorecard-scores]
verify_howto: >
  Senza alcuna credenziale: `curl
  https://api.securityscorecards.dev/projects/github.com/SPAZIO-GENESI/imgauth`
  (e allo stesso modo per `/SPAZIO-GENESI/imgauthweb` e
  `/SPAZIO-GENESI/autart-signer`) restituisce il punteggio pubblico
  OpenSSF Scorecard più recente con la scomposizione per singolo check
  (Dependency-Update-Tool, Maintained, Dangerous-Workflow,
  Token-Permissions, Pinned-Dependencies, ecc.). Primo dato reale
  raccolto il 2026-08-13: imgauth 5.7/10, imgauthweb 5.4/10, autart-signer
  2.9/10. Stesso giorno, in un secondo giro: branch protection attivata sui
  tre repo (no force-push, no cancellazione branch, status check `check`
  richiesto dove esiste — imgauth/imgauthweb; assente su autart-signer, che
  non ha alcun workflow su `pull_request`) e fine-grained PAT
  (`SCORECARD_TOKEN`, solo `Administration:Read-only`) aggiunto a
  `scorecard.yml` perché il `GITHUB_TOKEN` di default non può leggere le
  regole di branch protection — senza, il check Branch-Protection andava in
  errore (-1, escluso dal punteggio) invece di essere valutato. Con il
  fix: imgauth 7.6/10, imgauthweb 7.6/10, autart-signer 5.6/10,
  Branch-Protection 3/10 su tutti e tre ("not maximal": manca la PR
  obbligatoria, scartata di proposito perché il flusso di lavoro reale è a
  push diretto su main). Ogni repo ha un workflow schedulato settimanale
  (`scorecard.yml`, `workflow_dispatch` per un run manuale) che pubblica
  il risultato anche sul tab "Security → Code scanning" di GitHub — quella
  pagina però **richiede una sessione GitHub autenticata anche su repository
  pubblici** (verificato: `curl` a `github.com/.../security/code-scanning`
  senza credenziali risponde 404, e l'endpoint REST equivalente
  `api.github.com/.../code-scanning/alerts` risponde 401) — stesso tipo di
  limite del client `gh` già documentato in `CTL-build-provenance`/ADR-A1.
  L'API pubblica di securityscorecards.dev, usata sopra, non ha questo
  limite ed è la via primaria di verifica di questo controllo.
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-08-13
