id: CTL-edge-security-headers
title: "Header di sicurezza HTTP (HSTS, CSP, Permissions-Policy) all'edge Cloudflare"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01]
implemented_by: [IMP-edge-security-headers]
evidenced_by: [EVD-edge-security-headers]
verify_howto: >
  Interroga gli header di risposta di spaziogenesi.org o
  attestazione.spaziogenesi.org (es. curl -I o securityheaders.com):
  devono comparire Strict-Transport-Security (max-age un anno,
  includeSubDomains), Content-Security-Policy (script-src 'self' https:,
  SENZA 'unsafe-inline' dal 2026-07-14 — vedi ADR-edge-security-headers per
  come si è arrivati a rimuoverlo) e Permissions-Policy; l'
  Access-Control-Allow-Origin: * di GitHub Pages deve essere assente sui
  soli host Pages (spaziogenesi.org, www., attestazione.), MAI su
  imgauth.spaziogenesi.org dove il CORS resta necessario.
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-07-14
i18n:
  en:
    title: "HTTP security headers (HSTS, CSP, Permissions-Policy) at the Cloudflare edge"
    verify_howto: >
      Inspect the response headers of spaziogenesi.org or
      attestazione.spaziogenesi.org (e.g. curl -I or
      securityheaders.com): Strict-Transport-Security (max-age one year,
      includeSubDomains), Content-Security-Policy (script-src 'self'
      https:, WITHOUT 'unsafe-inline' since 2026-07-14 — see
      ADR-edge-security-headers for how it was removed) and
      Permissions-Policy must all be present; GitHub Pages'
      Access-Control-Allow-Origin: * must be absent on the Pages hosts
      only (spaziogenesi.org, www., attestazione.), NEVER on
      imgauth.spaziogenesi.org where CORS remains necessary.
