verify_howto: >
  Mensile: dal 2026-08-17 (P49, ADR-P49) la costruzione del bundle è un
  pulsante GitHub (.github/workflows/anchor-monthly.yml, workflow_dispatch),
  non più un comando da terminale. generators/anchor-monthly.mjs concatena i
  manifest.json degli snapshot settimanali non ancora coperti in un bundle
  deterministico (committato in snapshots/anchors/) e rifiuta di
  sovrascriverlo se esiste già per lo stesso mese; un umano scarica il file
  dal riepilogo del run, lo trascina su attestazione.spaziogenesi.org, genera
  l'attestazione e scarica il PDF (solo /api/cert-pdf innesca l'ancoraggio
  OpenTimestamps reale — resta l'unico passo umano per scelta, non per
  limite tecnico). Chiunque può ricalcolare l'hash del bundle nel repo gtf,
  confrontarlo con quello stampato sul certificato, e verificare la prova
  .ots indipendentemente su opentimestamps.org. Primo ancoraggio: periodo
  2026-07 (bundle snapshots/anchors/2026-07-bundle.json, hash
  cd57b5d3a96947a2264cbb237b3c8eb26cb130e2703838e0597d7b3189e5629b).
