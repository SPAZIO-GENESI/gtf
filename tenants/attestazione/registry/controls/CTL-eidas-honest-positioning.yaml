id: CTL-eidas-honest-positioning
title: "Dichiarazione esplicita e stabile: attestazione non qualificata, non un servizio eIDAS qualificato"
statement: >
  Il servizio produce attestazioni di esistenza non qualificate: firma
  elettronica avanzata con certificato self-signed, più marca temporale
  RFC 3161 (TSA in Adobe AATL) e ancoraggio Bitcoin (OpenTimestamps). Non
  è un servizio fiduciario qualificato eIDAS. Alle prove elettroniche non
  qualificate non possono essere negati effetti giuridici per il solo
  motivo della forma elettronica o della non-qualificazione; il valore
  probatorio è rimesso al giudice. L'upgrade a sigillo qualificato è nella
  roadmap pubblica, condizionato alla sostenibilità economica
  dell'organizzazione.
status: active
visibility: public
satisfies: [REQ-eidas-pos-01]
mitigates: [RSK-overclaim-eidas]
implemented_by: [IMP-gtf-site-eidas-disclosure]
evidenced_by: [EVD-gtf-site-public]
verify_howto: >
  Consulta https://attestazione.trust.spaziogenesi.org (il Trust Center
  dell'attestazione, dal 16 agosto 2026 su questo sottodominio — la radice
  trust.spaziogenesi.org ospita ora la pagina del framework), sezione "Cosa
  NON è questo servizio": il testo dichiara esplicitamente la natura non
  qualificata dell'attestazione. Se il testo dovesse sparire o essere
  annacquato in una futura revisione, il registro GTF lo renderebbe visibile
  (il record sorgente di questo controllo resta pubblico e versionato).
owner: it@spaziogenesi.org
review_every_days: 180
last_reviewed: 2026-07-09
i18n:
  en:
    title: "Explicit, stable statement: unqualified attestation, not a qualified eIDAS service"
    statement: >
      The service produces unqualified proof-of-existence attestations:
      an advanced electronic signature with a self-signed certificate,
      plus an RFC 3161 timestamp (TSA on the Adobe AATL) and a Bitcoin
      anchor (OpenTimestamps). It is not a qualified eIDAS trust
      service. Unqualified electronic evidence cannot be denied legal
      effect solely because it is in electronic form or unqualified; its
      evidentiary weight is for a judge to determine. Upgrading to a
      qualified seal is on the public roadmap, conditional on the
      organization's financial sustainability.
    verify_howto: >
      Check https://attestazione.trust.spaziogenesi.org (the attestation
      Trust Center, on this subdomain since 16 August 2026 — the root
      trust.spaziogenesi.org now hosts the framework's own page),
      section "What this service is NOT": the text explicitly states the
      unqualified nature of the attestation. Should this text ever
      disappear or be watered down in a future revision, the GTF
      registry would make that visible (this control's source record
      remains public and versioned).
