id: RSK-maintainer-unavailability
title: Indisponibilità temporanea o permanente dell'unico maintainer tecnico
description: >
  Il progetto ha un solo maintainer tecnico con accesso operativo a tutti
  gli account e i segreti critici: Cloudflare (Worker, D1, R2, Access, zona
  DNS), Azure (firmatario), organizzazione GitHub, npm, Stripe, backup
  offsite, bot Telegram. ADR-GTF-011 ha emendato la formula di
  MET-governance per lo stesso motivo di fondo — un maintainer singolo non
  ha una revisione tra pari via pull request — ma quell'emendamento misura
  la qualità del processo di rilascio (CI più gate umano), non la
  continuità della persona che lo gestisce: nessun altro record del
  registro copriva, prima di questo, l'indisponibilità della persona in sé.
  Il rischio non è teorico: la fascia Professionale (P27) vende una
  garanzia contrattuale di custodia dei certificati a cinque anni, un
  impegno pluriennale verso terzi paganti sostenuto oggi dalla
  disponibilità continuativa di una sola persona. Alla data di apertura di
  questo record (2026-08-13) non risulta individuato alcun secondo
  referente tecnico con accesso operativo.

  **Aggiornato il 21/08/2026**: un secondo referente tecnico è stato
  individuato, ha ricevuto un accesso operativo verificato con comando
  (Azure) e ha completato da solo, senza aiuto, il recupero dei segreti
  critici dal caveau esterno (`CTL-maintainer-succession`, ora `active`).
  La probabilità che l'indisponibilità del maintainer lasci il servizio
  senza nessuno in grado di intervenire scende da "media" a "bassa" per
  questo motivo — dato verificato, non riferito. L'impatto resta alto
  invariato: se il rischio si materializzasse comunque (es. entrambi i
  referenti indisponibili), le conseguenze sulla garanzia contrattuale
  della fascia Professionale sarebbero le stesse di prima. Restano aperti,
  e non riducono ulteriormente la probabilità finché non chiusi: la
  delibera e la pubblicazione della procedura scritta.
likelihood: low
impact: high
mitigated_by: [CTL-maintainer-succession]
visibility: public
i18n:
  en:
    title: "Temporary or permanent unavailability of the sole technical maintainer"
