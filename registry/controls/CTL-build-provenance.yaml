id: CTL-build-provenance
title: "Attestazione di provenienza SLSA/in-toto sui binari standalone di sg-attest (A1)"
status: active
visibility: public
satisfies: [REQ-27001-inspiration-01]
implemented_by: [IMP-attest-mcp-build-provenance, IMP-imgauthweb-cli-provenance-docs, IMP-attest-mcp-verify-provenance-script]
evidenced_by: [EVD-build-provenance-verify, EVD-build-provenance-script-verify]
verify_howto: >
  Procedura senza alcuna credenziale (chiude il gap PRN-08 descritto in
  ADR-A1): clona il repository pubblico, installa le dipendenze di
  sviluppo ed esegui lo script di verifica indipendente su un binario
  scaricato dalla pagina Release pubblica (es. `sg-attest-linux-x64` dal
  tag `v0.4.2`, https://github.com/SPAZIO-GENESI/attest-mcp/releases):

  `git clone https://github.com/SPAZIO-GENESI/attest-mcp && cd attest-mcp
  && npm install && node scripts/verify-provenance.mjs
  ./sg-attest-linux-x64 --repo SPAZIO-GENESI/attest-mcp --tag v0.4.2`

  Esito atteso: verifica riuscita (exit 0), con un predicato SLSA che
  referenzia il commit, il workflow `release-binaries.yml` e il tag. Lo
  script interroga solo l'endpoint REST pubblico delle attestazioni
  GitHub (nessun header Authorization, verificato) e verifica il bundle
  Sigstore con la libreria npm `sigstore` contro l'infrastruttura
  pubblica di Sigstore (Rekor/Fulcio/TUF, nessun account). La stessa
  verifica su un file alterato di un solo byte fallisce (il digest
  cambia, quindi cambia la chiave stessa con cui si cerca l'attestazione)
  — provato, così come il caso di un file rinominato ma con contenuto
  intatto (verifica riuscita con avviso, perché il legame è sul digest
  del subject in-toto, non sul nome file).

  In alternativa, per chi ha già `gh` autenticato: `gh attestation verify
  sg-attest-linux-x64 --repo SPAZIO-GENESI/attest-mcp` fa la stessa
  verifica, ma **richiede** una sessione GitHub autenticata anche su
  questo repository pubblico (verificato: senza `gh auth login`/
  `GH_TOKEN`, sia `gh attestation verify` sia `gh attestation download`
  rispondono exit 4, "please run gh auth login") — un limite del client,
  non del dato: l'endpoint REST sottostante è pubblico. Vedi ADR-A1 per
  la cronologia completa: il gap era nel client `gh`, non nella
  disponibilità del dato, e ora esiste una procedura equivalente che non
  ne eredita il limite.
